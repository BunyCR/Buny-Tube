<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BunyTube | Global Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --red: #ff0000; --black: #000; --neon: #00f2ff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; }
        body { background: var(--black); color: white; overflow-x: hidden; }

        /* MERKEZİ BAKIM EKRANI */
        #bakim-ekran { 
            position: fixed; inset: 0; background: #000; z-index: 1000000; 
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
        }
        .neon-text { font-size: 30px; font-weight: 900; color: var(--neon); text-shadow: 0 0 20px var(--neon); animation: float 3s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* HEADER & MARQUEE */
        header { background: #111; padding: 15px; border-bottom: 1px solid #222; }
        #duyuru-bar { background: var(--red); padding: 5px; font-size: 14px; overflow: hidden; white-space: nowrap; }
        .marquee { display: inline-block; animation: scroll 12s linear infinite; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* VİDEO ALANI */
        #main-content { padding: 20px; text-align: center; }
        .v-card { width: 100%; max-width: 500px; margin: 20px auto; background: #111; border-radius: 15px; overflow: hidden; border: 1px solid #222; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        .v-info { padding: 15px; font-weight: bold; color: var(--neon); }
    </style>
</head>
<body>

    <div id="bakim-ekran">
        <div class="neon-text">MERKEZİ BAKIM AKTİF</div>
        <p style="color:#555; margin-top:20px;">Patron Muhammed Ali tüm sistemi kilitledi.</p>
    </div>

    <div id="duyuru-bar">
        <div class="marquee" id="duyuru-txt">Sunucudan veri bekleniyor...</div>
    </div>

    <header>
        <h2 style="color:white;"><span style="color:var(--red);">▶</span> BunyTube</h2>
    </header>

    <div id="main-content">
        <h3>Öne Çıkan Video</h3>
        <div class="v-card" id="video-container">
            </div>
        <p style="margin-top:20px; color:#444;">BunyTube v4.0 Global Edition</p>
    </div>

    <script>
        async function sistemiGuncelle() {
            try {
                // Kendi GitHub kullanıcı adını ve repo adını buraya yazmalısın patron
                // Örnek: 'https://raw.githubusercontent.com/KULLANICI_ADIN/REPO_ADIN/main/config.json'
                const response = await fetch('config.json?t=' + new Date().getTime());
                const data = await response.json();

                // 1. Bakım Modu Kontrolü
                if(data.bakim_modu) {
                    document.getElementById('bakim-ekran').style.display = 'flex';
                } else {
                    document.getElementById('bakim-ekran').style.display = 'none';
                }

                // 2. Duyuru Güncelleme
                document.getElementById('duyuru-txt').innerText = data.duyuru_metni;

                // 3. Video Güncelleme
                document.getElementById('video-container').innerHTML = `
                    <iframe src="https://www.youtube-nocookie.com/embed/${data.one_cikan_video}" allowfullscreen></iframe>
                    <div class="v-info">Haftanın Videosu Seçildi ✅</div>
                `;

            } catch (error) {
                console.log("Sunucu bağlantı hatası patron!");
            }
        }

        // Sayfa açıldığında ve her 30 saniyede bir kontrol et
        sistemiGuncelle();
        setInterval(sistemiGuncelle, 30000);
    </script>
</body>
</html>
