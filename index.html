<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BunyTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --v-red: #ff0000; --v-black: #000; --neon: #00f2ff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; }
        body { background: var(--v-black); color: #fff; overflow-x: hidden; padding-bottom: 70px; }

        /* HAREKETLİ BAKIM EKRANI */
        #bakim-ekran { 
            position: fixed; inset: 0; background: #000; z-index: 1000000; 
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
        }
        .ani-text { 
            font-size: 30px; font-weight: 900; color: var(--neon);
            text-shadow: 0 0 20px var(--neon);
            animation: moveText 3s ease-in-out infinite;
        }
        @keyframes moveText {
            0%, 100% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-20px) scale(1.1); opacity: 0.7; }
        }
        .patron-key { margin-top: 100px; font-size: 35px; cursor: pointer; opacity: 0.1; transition: 0.3s; }
        .patron-key:hover { opacity: 1; color: var(--neon); }

        /* HEADER & ARAMA */
        header { position: sticky; top: 0; background: #0f0f0f; z-index: 1000; padding: 15px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; }
        .logo { font-size: 20px; font-weight: 900; color: #fff; flex-shrink: 0; }
        .logo span { color: var(--v-red); }
        .search-box { flex: 1; background: #222; border-radius: 20px; display: flex; align-items: center; padding: 5px 15px; }
        .search-box input { flex: 1; background: none; border: none; color: white; padding: 8px; outline: none; }

        /* VİDEO LİSTESİ */
        #feed { padding: 15px; }
        .v-card { margin-bottom: 25px; cursor: pointer; }
        .v-thumb { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #111; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-title { padding: 10px 0; font-size: 16px; font-weight: 500; line-height: 1.4; }

        /* PLAYER */
        #player-overlay { position: fixed; inset: 0; background: #000; z-index: 2000000; display: none; flex-direction: column; }
        .p-close { padding: 15px; font-size: 30px; color: var(--neon); cursor: pointer; }
    </style>
</head>
<body>

    <div id="bakim-ekran">
        <div class="ani-text">BAKIM MODU AKTİF</div>
        <p style="color: #444; margin-top: 10px;">Sistem Muhammed Ali tarafından güncelleniyor.</p>
        <div class="patron-key" onclick="app.patronCheck()">🔑</div>
    </div>

    <header>
        <div class="logo"><span>▶</span> BunyTube</div>
        <div class="search-box">
            <input type="text" id="q" placeholder="Video ara..." onkeyup="if(event.key==='Enter') app.search()">
            <i class="fas fa-search" onclick="app.search()"></i>
        </div>
    </header>

    <div id="feed"></div>

    <div id="player-overlay">
        <div class="p-close" onclick="app.closePlayer()"><i class="fas fa-chevron-down"></i></div>
        <div id="video-frame" style="width:100%; height:100%;"></div>
    </div>

    <script>
    const app = {
        init() {
            if(localStorage.getItem('buny_bakim') === 'true') {
                document.getElementById('bakim-ekran').style.display = 'flex';
            }
        },

        async search() {
            const q = document.getElementById('q').value;
            if(!q) return;
            const feed = document.getElementById('feed');
            feed.innerHTML = '<div style="text-align:center; padding:50px;">Yükleniyor...</div>';

            try {
                // Kesin sonuç veren Proxy üzerinden YouTube kazıma
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.youtube.com/results?search_query=' + q + '&sp=EgIQAQ%253D%253D')}`);
                const data = await res.json();
                const html = data.contents;
                
                const videoIds = [...html.matchAll(/"videoId":"([^"]+)"/g)].map(m => m[1]);
                const titles = [...html.matchAll(/"title":\{"runs":\[\{"text":"([^"]+)"/g)].map(m => m[1]);

                if(videoIds.length > 0) {
                    feed.innerHTML = '';
                    const results = [...new Set(videoIds)].slice(0, 15);
                    results.forEach((id, i) => {
                        feed.innerHTML += `
                            <div class="v-card" onclick="app.play('${id}')">
                                <div class="v-thumb"><img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg"></div>
                                <div class="v-title">${titles[i] || 'Video'}</div>
                            </div>`;
                    });
                }
            } catch(e) {
                feed.innerHTML = 'Hata oluştu, tekrar dene.';
            }
        },

        play(id) {
            document.getElementById('player-overlay').style.display = 'flex';
            document.getElementById('video-frame').innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" 
                style="width:100%; height:300px; border:none;" allowfullscreen></iframe>`;
        },

        closePlayer() {
            document.getElementById('player-overlay').style.display = 'none';
            document.getElementById('video-frame').innerHTML = '';
        },

        patronCheck() {
            const pw = prompt("Şifre gir:");
            if(pw === "Muhiy.1905") {
                const isBakim = localStorage.getItem('buny_bakim') === 'true';
                const s = confirm(isBakim ? "Bakımı kapat?" : "Bakımı aç?");
                if(s) {
                    localStorage.setItem('buny_bakim', !isBakim);
                    location.reload();
                }
            }
        }
    };
    window.onload = () => app.init();
    </script>
</body>
</html>
