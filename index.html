<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNY-Tube Premium</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --red: #ff0000; --bg: #0f0f0f; --card: #1e1e1e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: white; padding-bottom: 80px; overflow-x: hidden; }

        /* Üst Menü ve Kayan Yazı */
        .header { position: sticky; top: 0; background: rgba(15,15,15,0.9); backdrop-filter: blur(10px); padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 900; }
        .logo span { background: var(--red); padding: 2px 6px; border-radius: 6px; margin-left: 5px; }
        .promo-banner { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); margin: 10px; border-radius: 12px; overflow: hidden; white-space: nowrap; padding: 12px 0; }
        .scrolling-text { display: inline-block; padding-left: 100%; font-weight: bold; animation: marquee 12s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* Arama Alanı */
        .search-area { padding: 10px 15px; position: relative; }
        .search-wrapper { background: #1a1a1a; display: flex; align-items: center; padding: 12px 20px; border-radius: 40px; border: 3px solid var(--red); }
        input { flex: 1; background: transparent; border: none; color: white; font-size: 1.1rem; outline: none; }

        /* Video Kartları */
        #video-grid { padding: 10px; }
        .video-card { margin-bottom: 20px; cursor: pointer; border-radius: 12px; overflow: hidden; background: var(--card); }
        .video-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .video-info { padding: 12px; }
        .video-info h3 { font-size: 0.9rem; line-height: 1.3; margin-bottom: 5px; height: 2.6em; overflow: hidden; }

        /* Oynatıcı Panel */
        .player-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; z-index: 3000; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        
        /* Abone Olma Alanı */
        .channel-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #222; }
        .sub-btn { background: white; color: black; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; }
        .sub-btn.active { background: #333; color: #aaa; }

        /* Küçük Aksiyon Butonları */
        .action-bar { display: flex; justify-content: space-around; padding: 15px 5px; }
        .action-btn { background: #222; border: none; color: white; display: flex; align-items: center; gap: 8px; padding: 10px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
        .action-btn.active { color: var(--red); }
        
        /* Alt Navigasyon */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0f0f0f; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { color: #888; text-align: center; text-decoration: none; font-size: 0.7rem; cursor: pointer; }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; display: block; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">BUNY<span>Tube</span></div>
        <i class="fas fa-bell"></i>
    </header>

    <div class="promo-banner">
        <div class="scrolling-text">instagram: muhammedaliatl &nbsp;&nbsp;&nbsp;&nbsp; instagram: muhammedaliatl &nbsp;&nbsp;&nbsp;&nbsp; instagram: muhammedaliatl</div>
    </div>

    <div class="search-area">
        <div class="search-wrapper">
            <input type="text" id="search-input" placeholder="YouTube'da keşfe çık...">
            <i class="fas fa-search" onclick="search()" style="color:red"></i>
        </div>
    </div>

    <main id="video-grid"></main>

    <div id="player" class="player-overlay">
        <div style="padding:15px; background: #111;" onclick="closeVideo()"><i class="fas fa-chevron-down"></i> Kapat</div>
        <div id="video-frame"></div>
        
        <div class="channel-row">
            <div>
                <b id="channel-name" style="font-size: 1rem;">Kanal Adı</b>
            </div>
            <button class="sub-btn" id="sub-btn" onclick="toggleSub()">Abone Ol</button>
        </div>

        <div class="action-bar">
            <button class="action-btn" id="like-btn" onclick="toggleLike()">
                <i class="far fa-thumbs-up"></i> Beğen
            </button>
            <button class="action-btn" id="save-btn" onclick="toggleSave()">
                <i class="far fa-bookmark"></i> Kaydet
            </button>
            <button class="action-btn" onclick="download()" style="background: var(--red);">
                <i class="fas fa-download"></i> İndir
            </button>
        </div>
    </div>

    <nav class="nav-bar">
        <a class="nav-item active" onclick="loadHome()"><i class="fas fa-home"></i>Ana Sayfa</a>
        <a class="nav-item" onclick="search('shorts')"><i class="fas fa-bolt"></i>Shorts</a>
        <a class="nav-item"><i class="fas fa-plus-circle fa-2x"></i></a>
        <a class="nav-item" onclick="loadLibrary()"><i class="fas fa-video"></i>Kitaplık</a>
    </nav>

    <script>
        const API_KEY = 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0';
        let currentVideo = null;
        let savedVideos = JSON.parse(localStorage.getItem('buny_saved')) || [];
        let likedVideos = JSON.parse(localStorage.getItem('buny_liked')) || [];
        let subbedChannels = JSON.parse(localStorage.getItem('buny_subs')) || [];

        async function loadHome() { render(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=TR&maxResults=15&key=${API_KEY}`); }
        async function search(q) { 
            let query = q || document.getElementById('search-input').value;
            render(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&type=video&maxResults=15&key=${API_KEY}`, true); 
        }

        async function render(url, isSearch = false, customItems = null) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = "<p style='text-align:center;'>Yükleniyor...</p>";
            try {
                let items = customItems;
                if(!items) {
                    const res = await fetch(url);
                    const data = await res.json();
                    items = data.items;
                    if(isSearch) {
                        const ids = items.map(i => i.id.videoId).join(',');
                        const dRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=${ids}&key=${API_KEY}`);
                        const dData = await dRes.json(); items = dData.items;
                    }
                }
                grid.innerHTML = "";
                items.forEach(i => {
                    const id = i.id.videoId || i.id;
                    const v = i.snippet;
                    const s = i.statistics;
                    const videoData = JSON.stringify({id, title: v.title, channel: v.channelTitle, thumb: v.thumbnails.high.url, views: s?s.viewCount:0}).replace(/"/g, '&quot;');
                    grid.innerHTML += `<div class="video-card" onclick='openPlayer(${videoData})'><img src="${v.thumbnails.high.url}"><div class="video-info"><h3>${v.title}</h3><p>${v.channelTitle} • ${fViews(s?s.viewCount:0)} izlenme</p></div></div>`;
                });
            } catch(e) { grid.innerHTML = "<p>Hata!</p>"; }
        }

        function openPlayer(data) {
            currentVideo = data;
            document.getElementById('player').style.display = 'flex';
            document.getElementById('video-frame').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${data.id}?autoplay=1" allow="autoplay" allowfullscreen></iframe>`;
            document.getElementById('channel-name').innerText = data.channel;
            updateUI();
        }

        function toggleSub() {
            const index = subbedChannels.indexOf(currentVideo.channel);
            if(index === -1) subbedChannels.push(currentVideo.channel);
            else subbedChannels.splice(index, 1);
            localStorage.setItem('buny_subs', JSON.stringify(subbedChannels));
            updateUI();
        }

        function toggleLike() {
            const idx = likedVideos.findIndex(v => v.id === currentVideo.id);
            if(idx === -1) likedVideos.push(currentVideo); else likedVideos.splice(idx,1);
            localStorage.setItem('buny_liked', JSON.stringify(likedVideos)); updateUI();
        }

        function toggleSave() {
            const idx = savedVideos.findIndex(v => v.id === currentVideo.id);
            if(idx === -1) savedVideos.push(currentVideo); else savedVideos.splice(idx,1);
            localStorage.setItem('buny_saved', JSON.stringify(savedVideos)); updateUI();
        }

        function updateUI() {
            const isSubbed = subbedChannels.includes(currentVideo.channel);
            const subBtn = document.getElementById('sub-btn');
            subBtn.innerText = isSubbed ? "Abone Olundu" : "Abone Ol";
            subBtn.className = isSubbed ? "sub-btn active" : "sub-btn";

            const isLiked = likedVideos.some(v => v.id === currentVideo.id);
            document.getElementById('like-btn').className = isLiked ? 'action-btn active' : 'action-btn';
            
            const isSaved = savedVideos.some(v => v.id === currentVideo.id);
            document.getElementById('save-btn').className = isSaved ? 'action-btn active' : 'action-btn';
        }

        function loadLibrary() {
            const libItems = savedVideos.map(v => ({ id: v.id, snippet: { title: v.title, channelTitle: v.channel, thumbnails: { high: { url: v.thumb } } }, statistics: { viewCount: v.views } }));
            render(null, false, libItems);
        }

        function fViews(n) { if(n >= 1000000) return (n/1000000).toFixed(1)+'M'; if(n >= 1000) return (n/1000).toFixed(1)+'B'; return n; }
        function closeVideo() { document.getElementById('player').style.display = 'none'; document.getElementById('video-frame').innerHTML = ""; }
        function download() { window.open(`https://www.ssyoutube.com/watch?v=${currentVideo.id}`, '_blank'); }
        window.onload = loadHome;
    </script>
</body>
</html>
