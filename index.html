<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNY-Tube Unfiltered</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <h1 style="font-size: 20px;">BUNY <span style="color:red">Tube</span></h1>
        <div class="search-box">
            <i class="fas fa-search" style="color:#666"></i>
            <input type="text" id="search-input" placeholder="Her şeyi ara...">
        </div>
    </header>

    <main class="video-grid" id="video-container"></main>

    <div id="video-overlay">
        <div style="padding: 15px; background: #111; display: flex; align-items: center;" onclick="app.closeVideo()">
            <i class="fas fa-chevron-down"></i> <span style="margin-left: 10px">Kapat</span>
        </div>
        <div id="player-box" style="width: 100%; aspect-ratio: 16/9;"></div>
    </div>

    <nav>
        <div class="nav-btn active"><i class="fas fa-home"></i><br>Ana Sayfa</div>
        <div class="nav-btn"><i class="fas fa-compass"></i><br>Keşfet</div>
        <div class="nav-btn"><i class="fas fa-user"></i><br>Profil</div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
