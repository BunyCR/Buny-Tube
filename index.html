<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNY TUBE - SINIRSIZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff0000; --dark: #000000; --neon: #00f2ff; --neon-glow: 0 0 15px #00f2ff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--dark); color: white; padding-bottom: 100px; overflow-x: hidden; }

        /* BAKIM EKRANI */
        #maintenance-screen { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 999999; text-align: center; }
        
        /* BANNER - LOGODAN AYRI VE İNCE */
        #announcement-banner {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white; padding: 8px 0; font-size: 13px; font-weight: bold; overflow: hidden; white-space: nowrap; position: relative;
            margin: 25px auto 15px auto; width: 92%; border-radius: 50px; z-index: 1001;
        }
        .marquee { display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-weight: 900; font-size: 1.8rem; }
        header h1 span { color: var(--red); }

        .search-container { position: relative; max-width: 500px; margin: 20px auto; padding: 0 20px; }
        .search-container input { width: 100%; background: #111; border: 1px solid #333; padding: 15px 25px; border-radius: 30px; color: white; outline: none; }
        .search-container i { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); color: var(--neon); }

        .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; padding: 15px; }
        .v-card { background: #0a0a0a; border-radius: 12px; overflow: hidden; border: 1px solid #111; }
        .v-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }

        .bottom-nav { position: fixed; bottom: 30px; left: 0; width: 100%; height: 70px; background: #050505; border-top: 1px solid #111; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #555; text-align: center; font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--neon); }
        
        #admin-dashboard, #player, #admin-modal { position: fixed; inset: 0; background: #000; display: none; z-index: 20000; padding: 20px; }
        .neon-btn { background: var(--neon); color: black; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="maintenance-screen">
        <i class="fas fa-tools" style="font-size:50px; color:red;"></i>
        <h2 style="margin-top:20px;">SİSTEM BAKIMDA</h2>
        <p>Muhammed Ali iyileştirme yapıyor.</p>
    </div>

    <div id="announcement-banner"><div class="marquee" id="marquee-text">Kotasız ve Reklamsız Yeni Sistem Aktif!</div></div>

    <header>
        <h1>BUNY<span>TUBE</span></h1>
        <i class="fas fa-user-shield" onclick="app.openAdminModal()"></i>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Video ara..." onkeyup="if(event.key === 'Enter') app.search()">
        <i class="fas fa-search" onclick="app.search()"></i>
    </div>

    <main id="main-feed" class="feed"></main>

    <div id="admin-modal" style="display:none; justify-content:center; align-items:center; background:rgba(0,0,0,0.9);">
        <div style="background:#111; padding:30px; border-radius:20px; border:1px solid var(--neon); text-align:center; width:80%;">
            <h3>PATRON GİRİŞİ</h3>
            <input type="password" id="admin-pass" style="width:100%; padding:10px; margin:20px 0; background:#000; color:white; border:1px solid #333;">
            <button class="neon-btn" onclick="app.checkAdmin()">GİRİŞ</button>
            <p onclick="app.closeAdminModal()" style="margin-top:15px; color:#555;">KAPAT</p>
        </div>
    </div>

    <div id="admin-dashboard">
        <h2 style="color:var(--neon)">YÖNETİM</h2>
        <div style="background:#111; padding:15px; border-radius:10px; margin:20px 0;">
            <h4>Bakım Modu</h4>
            <button onclick="app.setBakim(true)" style="background:red; color:white; padding:10px; border:none; margin-top:10px;">AÇ</button>
            <button onclick="app.setBakim(false)" style="background:green; color:white; padding:10px; border:none; margin-left:10px;">KAPAT</button>
        </div>
        <button class="neon-btn" onclick="app.closeAdminPanel()">PANELİ KAPAT</button>
    </div>

    <div id="player">
        <i class="fas fa-times" onclick="app.closePlayer()" style="font-size:25px; margin-bottom:20px;"></i>
        <div id="player-box" style="width:100%; aspect-ratio:16/9;"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="location.reload()"><i class="fas fa-home"></i><br>Ana Sayfa</div>
        <div class="nav-item" onclick="app.openAdminModal()"><i class="fas fa-lock"></i><br>Yetkili</div>
    </div>

    <script>
    const app = {
        apiBase: 'https://pipedapi.kavin.rocks',

        init() {
            if(localStorage.getItem('muhammed_bakim') === 'true') document.getElementById('maintenance-screen').style.display = 'flex';
        },

        async search() {
            const q = document.getElementById('search-input').value;
            const feed = document.getElementById('main-feed');
            feed.innerHTML = '<p style="color:var(--neon); text-align:center; width:100%;">Yükleniyor...</p>';
            try {
                const res = await fetch(`${this.apiBase}/search?q=${encodeURIComponent(q)}&filter=videos`);
                const data = await res.json();
                feed.innerHTML = data.content.map(v => `
                    <div class="v-card" onclick="app.play('${v.url.split('=')[1]}')">
                        <img src="${v.thumbnail}">
                        <div style="padding:10px;"><h4>${v.title}</h4></div>
                    </div>`).join('');
            } catch (e) { feed.innerHTML = '<p>Hata oluştu, tekrar dene!</p>'; }
        },

        play(id) {
            document.getElementById('player').style.display = 'block';
            document.getElementById('player-box').innerHTML = `<iframe src="https://piped.video/embed/${id}?autoplay=1" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
        },

        setBakim(v) { localStorage.setItem('muhammed_bakim', v); location.reload(); },
        checkAdmin() { if(document.getElementById('admin-pass').value === "Muhiy.1905") { document.getElementById('admin-dashboard').style.display = 'block'; } else { alert("Hatalı!"); } },
        openAdminModal() { document.getElementById('admin-modal').style.display = 'flex'; },
        closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; },
        closeAdminPanel() { document.getElementById('admin-dashboard').style.display = 'none'; },
        closePlayer() { document.getElementById('player').style.display = 'none'; document.getElementById('player-box').innerHTML = ''; }
    };
    window.onload = () => app.init();
    </script>
</body>
</html>
