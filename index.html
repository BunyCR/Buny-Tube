<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUNY-Tube V5500 | Titanium Fix</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">

    <style>
        :root {
            --m-red: #ff0000;
            --m-black: #000000;
            --m-surface: #0a0a0a;
            --m-border: #1a1a1a;
            --m-glow: 0 0 30px rgba(255, 0, 0, 0.4);
            --m-ease: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--m-black); color: #fff; overflow-x: hidden; padding-bottom: 120px; }
        ::-webkit-scrollbar { display: none; }

        /* [SHORTS SLAYER] */
        #shorts-lock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000000; display: none;
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px;
        }
        .lock-box { border: 2px solid var(--m-red); padding: 50px 30px; border-radius: 40px; background: var(--m-surface); box-shadow: var(--m-glow); }

        /* [HEADER] */
        header {
            position: sticky; top: 0; z-index: 50000;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            padding: 20px; border-bottom: 1px solid var(--m-border);
        }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; }
        .logo span { background: var(--m-red); padding: 2px 10px; border-radius: 8px; margin-left: 5px; box-shadow: var(--m-glow); }

        /* [SEARCH] */
        .search-row { display: flex; gap: 10px; padding: 0 15px 15px; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); }
        .search-bar { flex: 1; background: #111; border: 1px solid #222; border-radius: 50px; padding: 12px 20px; display: flex; align-items: center; }
        .search-bar input { background: transparent; border: none; color: #fff; width: 100%; outline: none; }
        .mic-btn { width: 45px; height: 45px; background: #111; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--m-red); border: 1px solid #222; }

        /* [FEED GRID] */
        .grid { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 10px; }
        .card { background: transparent; margin-bottom: 20px; cursor: pointer; }
        .thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; border: 1px solid var(--m-border); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .meta { display: flex; padding: 15px 5px; gap: 15px; }
        .pfp { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; flex-shrink: 0; }
        .info h3 { font-size: 1rem; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .info p { color: #888; font-size: 0.85rem; margin-top: 5px; }

        /* [MINI PLAYER DOCK - THE TITANIUM BRIDGE] */
        #mini-dock {
            position: fixed; bottom: 100px; right: 15px; width: 220px; aspect-ratio: 16/9;
            z-index: 100001; border: 2px solid var(--m-red); border-radius: 15px;
            overflow: hidden; background: #000; display: none; box-shadow: var(--m-glow);
            transition: 0.4s var(--m-ease);
        }
        .mini-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .mini-close { position: absolute; top: 5px; right: 5px; background: red; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; z-index: 20; }

        /* [FULL PLAYER] */
        #player-ui {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100000; display: none; flex-direction: column;
        }
        .p-bar { padding: 20px; background: #050505; display: flex; align-items: center; gap: 15px; font-weight: 900; border-bottom: 1px solid #1a1a1a; cursor: pointer; }

        /* [NAV] */
        nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.98);
            border-top: 1px solid var(--m-border); display: flex; justify-content: space-around;
            padding: 20px 0 calc(25px + env(safe-area-inset-bottom)); z-index: 50000;
        }
        .nav-item { text-align: center; color: #555; font-size: 0.8rem; font-weight: 900; }
        .nav-item.active { color: #fff; }
        .nav-item i { display: block; font-size: 1.8rem; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div id="shorts-lock">
        <div class="lock-box">
            <i class="fas fa-shield-halved" style="font-size:4rem; color:red; margin-bottom:20px;"></i>
            <h2 style="font-family:'Orbitron';">MUHAMMED ALİ KORUMASI</h2>
            <p style="margin:20px 0; color:#888;">Shorts zihnini yorar kanka, seni uzun videolara yönlendiriyorum!</p>
            <button onclick="titan.ui.closeShorts()" style="background:red; color:#fff; border:none; padding:12px 30px; border-radius:10px; font-weight:900;">TAMAM KRAL</button>
        </div>
    </div>

    <div id="mini-dock">
        <div class="mini-close" onclick="titan.ui.killPlayer()"><i class="fas fa-times"></i></div>
        <div class="mini-overlay" onclick="titan.ui.expandPlayer()"></div>
        <div id="mini-target" style="width:100%; height:100%;"></div>
    </div>

    <header>
        <div class="logo" onclick="titan.engine.home()">BUNY<span>Tube</span></div>
    </header>

    <div class="search-row">
        <div class="search-bar">
            <input type="text" id="m-search" placeholder="Geleceği Ara..." onkeypress="if(event.key==='Enter') titan.engine.search()">
            <i class="fas fa-search" style="opacity:0.3"></i>
        </div>
        <div class="mic-btn" onclick="titan.engine.voice()"><i class="fas fa-microphone"></i></div>
    </div>

    <main class="grid" id="main-feed"></main>

    <div id="player-ui">
        <div class="p-bar" onclick="titan.ui.minimizePlayer()">
            <i class="fas fa-chevron-down"></i> VİDEOYU SİSTEMDE TUT (KÜÇÜLT)
        </div>
        <div id="main-target" style="width:100%; aspect-ratio:16/9; background:#000;"></div>
        <div style="padding:20px; flex:1; overflow-y:auto;">
            <h2 id="p-title" style="margin-bottom:20px; font-size:1.2rem;"></h2>
            <div class="grid" id="related-feed"></div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="titan.engine.home()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item" onclick="titan.ui.openShorts()"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-item"><i class="fas fa-crown"></i>Kral</div>
    </nav>

    <script>
        const titan = {
            state: { activeId: null, activeTitle: null, isMini: false },
            config: {
                key: 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0',
                colors: ['#ff4444', '#44ff44', '#4444ff', '#ffbb33', '#aa66cc', '#33b5e5'],
                // [GÜNCEL YEDEK HAVUZ]
                pool: [
                    {id: 'WpAbtdX5WuU', t: '2026 Mars Hayali Çöktü mü? - Starship', c: 'Barış Özcan'},
                    {id: 'DRMy3mRgW6Y', t: 'Amazon Kuiper: 2026 Uydu İnterneti', c: 'Teknoloji TV'},
                    {id: 'lXr19zpQ4h0', t: 'Çin 2050 Teknolojisini Yaşıyor🚀', c: 'Global Tech'},
                    {id: 'GWltQO23mQw', t: 'En Korkutucu 3 Uzay Gerçeği', c: 'Galaktot'},
                    {id: 'ScaQdZmpTQw', t: '4 Milyar Yıl Önce Gezegenler', c: 'Bilim Hattı'}
                ]
            },
            ui: {
                openShorts: () => document.getElementById('shorts-lock').style.display = 'flex',
                closeShorts: () => document.getElementById('shorts-lock').style.display = 'none',
                
                // [AUDIO GHOSTING FIX: Eski videoyu sil, yeni dock oluştur]
                minimizePlayer: function() {
                    const id = titan.state.activeId;
                    if(!id) return;
                    
                    // Önce ana oynatıcıyı temizle (SESİ KESER)
                    document.getElementById('main-target').innerHTML = "";
                    document.getElementById('player-ui').style.display = 'none';
                    
                    // Dock'ı aç ve videoyu oraya taşı
                    document.getElementById('mini-dock').style.display = 'block';
                    document.getElementById('mini-target').innerHTML = titan.engine.getFrame(id);
                    titan.state.isMini = true;
                },

                expandPlayer: function() {
                    const id = titan.state.activeId;
                    // Mini dock'ı temizle (SESİ KESER)
                    document.getElementById('mini-target').innerHTML = "";
                    document.getElementById('mini-dock').style.display = 'none';
                    
                    // Ana oynatıcıya taşı
                    document.getElementById('player-ui').style.display = 'flex';
                    document.getElementById('main-target').innerHTML = titan.engine.getFrame(id);
                    titan.state.isMini = false;
                },

                killPlayer: function() {
                    document.getElementById('mini-target').innerHTML = "";
                    document.getElementById('mini-dock').style.display = 'none';
                    titan.state.activeId = null;
                }
            },
            engine: {
                home: function() {
                    this.fetch('teknoloji inceleme 2026');
                    window.scrollTo(0,0);
                },
                search: function() {
                    const q = document.getElementById('m-search').value;
                    if(q) this.fetch(q);
                },
                fetch: async function(q) {
                    const box = document.getElementById('main-feed');
                    try {
                        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&maxResults=15&key=${titan.config.key}`);
                        const d = await res.json();
                        box.innerHTML = "";
                        d.items.forEach(v => this.render(box, v.id.videoId, v.snippet.title, v.snippet.channelTitle));
                    } catch(e) {
                        box.innerHTML = "";
                        titan.config.pool.forEach(v => this.render(box, v.id, v.t, v.c));
                    }
                },
                render: function(box, id, title, channel) {
                    const color = titan.config.colors[Math.floor(Math.random() * titan.config.colors.length)];
                    const letter = channel.charAt(0).toUpperCase();
                    
                    // [THUMBNAIL FALLBACK FIX]
                    // maxresdefault bazen yoktur, hqdefault her zaman vardır.
                    const thumb = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

                    box.innerHTML += `
                        <div class="card" onclick="titan.engine.play('${id}', '${title.replace(/'/g,"")}')">
                            <div class="thumb"><img src="${thumb}" onerror="this.src='https://img.youtube.com/vi/${id}/0.jpg'"></div>
                            <div class="meta">
                                <div class="pfp" style="background:${color}">${letter}</div>
                                <div class="info">
                                    <h3>${title}</h3>
                                    <p>${channel} • 2026</p>
                                </div>
                            </div>
                        </div>`;
                },
                getFrame: function(id) {
                    return `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1&rel=0" 
                            style="width:100%; height:100%; border:none;" allow="autoplay; fullscreen"></iframe>`;
                },
                play: function(id, title) {
                    titan.state.activeId = id;
                    titan.state.activeTitle = title;
                    document.getElementById('player-ui').style.display = 'flex';
                    document.getElementById('p-title').innerText = title;
                    document.getElementById('main-target').innerHTML = this.getFrame(id);
                    document.getElementById('mini-dock').style.display = 'none';
                    this.fetchRelated(title);
                },
                fetchRelated: function(q) {
                    const box = document.getElementById('related-feed');
                    box.innerHTML = "";
                    titan.config.pool.sort(() => 0.5 - Math.random()).forEach(v => this.render(box, v.id, v.t, v.c));
                },
                voice: function() {
                    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if(!SR) return;
                    const rec = new SR(); rec.lang = 'tr-TR';
                    rec.onresult = (e) => {
                        document.getElementById('m-search').value = e.results[0][0].transcript;
                        this.search();
                    };
                    rec.start();
                }
            }
        };

        window.onload = () => titan.engine.home();
    </script>
</body>
</html>
