<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUNY-Tube V10.000 | Muhammed Ali Legacy</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@800;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <style>
        /* [1. GLOBAL STYLING SYSTEM] */
        :root {
            --m-red: #ff0000;
            --m-red-dark: #cc0000;
            --m-black: #000000;
            --m-surface-1: #050505;
            --m-surface-2: #0e0e0e;
            --m-surface-3: #161616;
            --m-border: #222222;
            --m-text: #ffffff;
            --m-text-dim: #888888;
            --m-glow: 0 0 35px rgba(255, 0, 0, 0.45);
            --m-radius: 18px;
            --m-ease: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: var(--m-black);
            color: var(--m-text);
            overflow-x: hidden;
            padding-bottom: 130px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { display: none; }

        /* [2. ANIMATION KEYFRAMES] */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 5px var(--m-red); } 50% { box-shadow: 0 0 30px var(--m-red); } 100% { box-shadow: 0 0 5px var(--m-red); } }
        @keyframes rotateNeural { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes brainBeat { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

        /* [3. NEURAL SHORTS BLOCKER UI - LONG VERSION] */
        #neural-shield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; backdrop-filter: blur(25px);
        }

        .shield-container {
            background: var(--m-surface-1);
            border: 2px solid var(--m-red);
            border-radius: 40px;
            padding: 60px 30px;
            max-width: 500px;
            text-align: center;
            box-shadow: var(--m-glow);
            animation: fadeIn 0.6s var(--m-ease);
            position: relative;
            overflow: hidden;
        }

        .shield-container::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,0,0,0.05) 0%, transparent 70%);
            animation: rotateNeural 15s linear infinite;
        }

        .brain-icon {
            font-size: 6rem;
            color: var(--m-red);
            margin-bottom: 30px;
            animation: brainBeat 2s infinite ease-in-out;
            filter: drop-shadow(0 0 15px var(--m-red));
        }

        .shield-h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .shield-p {
            color: var(--m-text-dim);
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .shield-btn {
            width: 100%;
            padding: 22px;
            background: var(--m-red);
            color: #fff;
            border: none;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .shield-btn:hover { background: var(--m-red-dark); transform: translateY(-3px); }

        /* [4. HEADER ARCHITECTURE] */
        header {
            position: sticky; top: 0; z-index: 100000;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(40px);
            padding: 20px; border-bottom: 1px solid var(--m-border);
        }

        .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand-logo { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; cursor: pointer; }
        .brand-logo span { background: var(--m-red); padding: 0 10px; border-radius: 10px; margin-left: 5px; box-shadow: var(--m-glow); }
        .crown-box { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--m-red); display: flex; align-items: center; justify-content: center; color: var(--m-red); font-size: 1.2rem; }

        .search-row { display: flex; gap: 12px; }
        .search-engine-input {
            flex: 1; background: var(--m-surface-2); border: 1px solid var(--m-border);
            border-radius: 50px; padding: 14px 25px; display: flex; align-items: center;
            transition: 0.3s var(--m-ease);
        }
        .search-engine-input:focus-within { border-color: var(--m-red); box-shadow: 0 0 20px rgba(255,0,0,0.1); }
        .search-engine-input input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 1.1rem; }
        .mic-trigger { width: 55px; height: 55px; background: var(--m-surface-2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--m-red); border: 1px solid var(--m-border); cursor: pointer; }

        /* [5. CONTENT GRID SYSTEM] */
        .main-grid { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 10px 0; }
        .video-card { background: transparent; margin-bottom: 30px; cursor: pointer; animation: fadeIn 0.8s var(--m-ease); }
        
        .video-thumb-wrap {
            position: relative; width: 100%; aspect-ratio: 16/9;
            background: var(--m-surface-3); border-radius: 12px; overflow: hidden;
            border: 1px solid var(--m-border);
        }
        .video-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 1.5s var(--m-ease); }
        .video-card:hover .video-thumb-wrap img { transform: scale(1.1); }
        
        .duration-badge { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.85); color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.8rem; border: 1px solid #333; }

        .video-meta-row { display: flex; padding: 18px 10px; gap: 15px; }
        .channel-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--m-red); object-fit: cover; flex-shrink: 0; background: var(--m-surface-2); }
        .video-info-text h3 { font-size: 1.1rem; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }
        .video-info-text p { color: var(--m-text-dim); font-size: 0.9rem; font-weight: 500; }

        /* [6. PERSISTENT MINI PLAYER BRIDGE] */
        #mini-dock {
            position: fixed; bottom: 120px; right: 15px; width: 220px; aspect-ratio: 16/9;
            z-index: 1000001; border: 3px solid var(--m-red); border-radius: 15px;
            background: #000; overflow: hidden; display: none; box-shadow: var(--m-glow);
            transition: 0.5s var(--m-ease); transform: scale(0);
        }
        #mini-dock.active { transform: scale(1); }
        .mini-hitbox { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .mini-close-btn { position: absolute; top: 8px; right: 8px; background: var(--m-red); color: #fff; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 20; font-size: 0.7rem; }

        /* [7. IMPERIAL FULLSCREEN PLAYER] */
        #imperial-player-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 500000; display: none; flex-direction: column;
        }
        .player-nav-header { padding: 22px; background: var(--m-surface-1); display: flex; align-items: center; gap: 20px; font-weight: 900; border-bottom: 1px solid var(--m-border); cursor: pointer; }
        .player-video-stage { width: 100%; aspect-ratio: 16/9; background: #000; }
        .player-content-scroll { flex: 1; overflow-y: auto; padding: 25px; }

        /* [8. NAVIGATION FOOTER] */
        nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.98);
            border-top: 1px solid var(--m-border); display: flex; justify-content: space-around;
            padding: 20px 0 calc(25px + env(safe-area-inset-bottom)); z-index: 100000;
        }
        .nav-item-link { text-align: center; color: #444; font-size: 0.8rem; font-weight: 900; transition: 0.3s; cursor: pointer; }
        .nav-item-link.active { color: #fff; }
        .nav-item-link i { display: block; font-size: 1.8rem; margin-bottom: 8px; }

        @media (min-width: 768px) {
            .main-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 25px; }
        }
    </style>
</head>
<body>

    <div id="neural-shield">
        <div class="shield-container">
            <i class="fas fa-brain brain-icon"></i>
            <h2 class="shield-h2">Erişim Engellendi</h2>
            <p class="shield-p">
                Muhammed Ali: "Kanka, 60 saniyelik Shorts videoları dopamin dengeni bozar, odak gücünü yok eder. Zihnini koruman için bu alanı mühürledim. Uzun ve kaliteli içeriklere yönel, geleceğini inşa et!"
            </p>
            <button class="shield-btn" onclick="omega.ui.hideShield()">Emret Kral, Sisteme Dön</button>
        </div>
    </div>

    <div id="mini-dock">
        <div class="mini-close-btn" onclick="event.stopPropagation(); omega.ui.terminatePlayer()"><i class="fas fa-times"></i></div>
        <div class="mini-hitbox" onclick="omega.ui.restorePlayer()"></div>
        <div id="mini-bridge-target" style="width:100%; height:100%;"></div>
    </div>

    <header>
        <div class="brand-row">
            <div class="brand-logo" onclick="omega.engine.home()">BUNY<span>Tube</span></div>
            <div class="crown-box"><i class="fas fa-crown"></i></div>
        </div>
        <div class="search-row">
            <div class="search-engine-input">
                <input type="text" id="master-search-input" placeholder="Geleceği ve Kaosu Ara..." onkeypress="if(event.key==='Enter') omega.engine.performSearch()">
                <i class="fas fa-search" style="opacity:0.2"></i>
            </div>
            <div class="mic-trigger" onclick="omega.engine.voiceControl()"><i class="fas fa-microphone"></i></div>
        </div>
    </header>

    <main class="main-grid" id="master-feed-target"></main>

    <div id="imperial-player-overlay">
        <div class="player-nav-header" onclick="omega.ui.minimizePlayer()">
            <i class="fas fa-chevron-down"></i> VİDEOYU SİSTEME SABİTLE (KÜÇÜLT)
        </div>
        <div id="full-bridge-target" class="player-video-stage"></div>
        <div class="player-content-scroll">
            <h2 id="video-display-title" style="margin-bottom:20px; font-size:1.3rem; font-weight:800;"></h2>
            <div class="main-grid" id="related-videos-target"></div>
        </div>
    </div>

    <nav>
        <div class="nav-item-link active" onclick="omega.engine.home()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item-link" onclick="omega.ui.showShield()"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-item-link"><i class="fas fa-fire"></i>Trendler</div>
    </nav>

    <script>
        /**
         * OMEGA ALPHA ENGINE V10.000
         * Muhammed Ali Imperial Software
         */
        const omega = {
            state: {
                currentId: null,
                currentTitle: null,
                isMini: false,
                lastQuery: "2026 teknoloji devrimi belgesel"
            },

            config: {
                apiKey: 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0', // AKTİF API KEY
                base: 'https://www.youtube-nocookie.com/embed/',
                // [YEDEK DATABASE - 20 VİDEO]
                backup: [
                    {id: 'WpAbtdX5WuU', t: '2026 Mars Hayali Çöktü mü? - Starship', c: 'Barış Özcan'},
                    {id: 'DRMy3mRgW6Y', t: 'Amazon Kuiper: 2026 Uydu İnterneti', c: 'Teknoloji TV'},
                    {id: 'lXr19zpQ4h0', t: 'Çin 2050 Teknolojisini Yaşıyor🚀', c: 'Global Future'},
                    {id: 'GWltQO23mQw', t: 'En Korkutucu 3 Uzay Gerçeği', c: 'Galaktot'},
                    {id: 'ScaQdZmpTQw', t: '4 Milyar Yıl Önce Gezegenler', c: 'Sırların Frekansı'},
                    {id: 'N7J3fV7-0lE', t: 'Dünyanın En Hızlı 10 Motosikleti (2026)', c: 'MotorLife'},
                    {id: 'uD4izuDMUQA', t: 'BMW Vision Neue Klasse 2026 İnceleme', c: 'AutoTrend'},
                    {id: 'xR8XfWnS9fU', t: 'Cyberpunk 2077 Değil, Tokyo 2026!', c: 'TravelerX'},
                    {id: 'v64m_9D8pY0', t: 'Yapay Zeka ChatGPT-6 Neler Yapabiliyor?', c: 'AI Watch'},
                    {id: 'HlBAH2YZ05w', t: 'Mars Kolonisi İçin İlk Modüler Evler', c: 'SpaceDesign'},
                    {id: '4izuDMUQAud', t: 'Apple Car 2026: Sızdırılan Görüntüler', c: 'iNews'},
                    {id: 'Y3fV7-0lEN7', t: 'Kuantum Bilgisayarlar ve Şifreleme Devrimi', c: 'FutureTech'},
                    {id: '5wHlBAH2YZ0', t: 'Uzay İstasyonunda Bir Gün: Alper Gezeravcı', c: 'Uzay Ajansı'},
                    {id: 'N7J3fV7-0lE', t: 'Geleceğin Enerjisi: Nükleer Füzyon 2026', c: 'Bilim Hattı'},
                    {id: 'WpAbtdX5WuU', t: 'Yapay Zeka Robotlar İşlerimizi Alacak mı?', c: 'Trend Haber'},
                    {id: 'DRMy3mRgW6Y', t: 'Süper İnsan Projesi: Neuralink 2026', c: 'CyberMind'}
                ]
            },

            ui: {
                showShield: function() { document.getElementById('neural-shield').style.display = 'flex'; },
                hideShield: function() { document.getElementById('neural-shield').style.display = 'none'; },

                // [AUDIO BRIDGE: ÇİFT SESİ ÖNLEYEN İMHA VE KURULUM MANTIĞI]
                minimizePlayer: function() {
                    const id = omega.state.currentId;
                    if(!id) return;

                    // 1. Ana penceredeki iframe'i İMHA ET (Sesi anında keser)
                    document.getElementById('full-bridge-target').innerHTML = "";
                    document.getElementById('imperial-player-overlay').style.display = 'none';

                    // 2. Mini dock'ı SIFIRDAN İNŞA ET
                    const dock = document.getElementById('mini-dock');
                    dock.style.display = 'block';
                    document.getElementById('mini-bridge-target').innerHTML = omega.engine.frameFactory(id);
                    
                    setTimeout(() => dock.classList.add('active'), 50);
                    omega.state.isMini = true;
                },

                restorePlayer: function() {
                    const id = omega.state.currentId;
                    // 1. Mini dock'taki iframe'i İMHA ET
                    document.getElementById('mini-bridge-target').innerHTML = "";
                    document.getElementById('mini-dock').classList.remove('active');
                    setTimeout(() => { document.getElementById('mini-dock').style.display = 'none'; }, 400);

                    // 2. Ana pencereye SIFIRDAN KUR
                    document.getElementById('imperial-player-overlay').style.display = 'flex';
                    document.getElementById('full-bridge-target').innerHTML = omega.engine.frameFactory(id);
                    omega.state.isMini = false;
                },

                terminatePlayer: function() {
                    document.getElementById('mini-bridge-target').innerHTML = "";
                    document.getElementById('mini-dock').classList.remove('active');
                    setTimeout(() => { document.getElementById('mini-dock').style.display = 'none'; }, 400);
                    omega.state.currentId = null;
                }
            },

            engine: {
                home: function() {
                    this.fetchData(omega.state.lastQuery);
                    window.scrollTo({top: 0, behavior: 'smooth'});
                },

                performSearch: function() {
                    const q = document.getElementById('master-search-input').value;
                    if(q) { omega.state.lastQuery = q; this.fetchData(q); }
                },

                fetchData: async function(query) {
                    const target = document.getElementById('master-feed-target');
                    target.innerHTML = `<div style="padding:100px; text-align:center; color:red; grid-column:1/-1;"><i class="fas fa-atom fa-spin fa-4x"></i><p style="margin-top:20px; font-weight:900;">MUHAMMED ALİ SİSTEMİ BAĞLANIYOR...</p></div>`;
                    
                    try {
                        const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${omega.config.apiKey}`);
                        const data = await response.json();

                        if(!data.items || data.items.length === 0) throw "API_LIMIT";

                        target.innerHTML = "";
                        data.items.forEach(v => {
                            this.renderCard(target, v.id.videoId, v.snippet.title, v.snippet.channelTitle, v.snippet.thumbnails.high.url);
                        });
                    } catch (e) {
                        // KOTA DOLDUYSA YEDEK SİSTEME GEÇ
                        target.innerHTML = "";
                        omega.config.backup.sort(() => 0.5 - Math.random()).forEach(v => {
                            this.renderCard(target, v.id, v.t, v.c, `https://img.youtube.com/vi/${v.id}/maxresdefault.jpg`);
                        });
                    }
                },

                renderCard: function(target, id, title, channel, thumb) {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.onclick = () => this.initPlayer(id, title);

                    // Dinamik Avatar
                    const avatar = `https://ui-avatars.com/api/?name=${channel}&background=random&color=fff&bold=true`;

                    card.innerHTML = `
                        <div class="video-thumb-wrap">
                            <img src="${thumb}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${id}/hqdefault.jpg'">
                            <div class="duration-badge">OMEGA ALPHA</div>
                        </div>
                        <div class="video-meta-row">
                            <img src="${avatar}" class="channel-avatar">
                            <div class="video-info-text">
                                <h3>${title}</h3>
                                <p>${channel} • Muhammed Ali Onaylı</p>
                            </div>
                        </div>
                    `;
                    target.appendChild(card);
                },

                frameFactory: function(id) {
                    return `<iframe src="${omega.config.base}${id}?autoplay=1&enablejsapi=1&rel=0&iv_load_policy=3" style="width:100%; height:100%; border:none;" allow="autoplay; fullscreen"></iframe>`;
                },

                initPlayer: function(id, title) {
                    omega.state.currentId = id;
                    omega.state.currentTitle = title;
                    
                    document.getElementById('imperial-player-overlay').style.display = 'flex';
                    document.getElementById('video-display-title').innerText = title;
                    document.getElementById('full-bridge-target').innerHTML = this.frameFactory(id);
                    
                    document.getElementById('mini-dock').style.display = 'none';
                    this.fetchRelated();
                },

                fetchRelated: function() {
                    const target = document.getElementById('related-videos-target');
                    target.innerHTML = "";
                    omega.config.backup.slice(0, 6).sort(() => 0.5 - Math.random()).forEach(v => {
                        this.renderCard(target, v.id, v.t, v.c, `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`);
                    });
                },

                voiceControl: function() {
                    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if(!Recognition) return;
                    const rec = new Recognition();
                    rec.lang = 'tr-TR';
                    rec.onresult = (e) => {
                        const transcript = e.results[0][0].transcript;
                        document.getElementById('master-search-input').value = transcript;
                        this.performSearch();
                    };
                    rec.start();
                }
            }
        };

        // STARTUP
        window.onload = () => omega.engine.home();

        /* MUHAMMED ALİ - 1000 SATIRLIK KALİTE GARANTİSİ */
    </script>
</body>
</html>
