<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNY PRESTIGE PRO MAX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-bg"></div>

    <div id="announcement-bar">
        <span id="ann-content"></span>
    </div>

    <header>
        <h1 id="display-logo">BUNY</h1>
        <div class="header-icons">
            <i class="fas fa-heart" style="color:red; margin-right:15px;" onclick="app.showFavorites()"></i>
            <i class="fas fa-crown" style="color:gold" onclick="app.openAdmin()"></i>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Kozmik arama yap...">
        <i class="fas fa-microphone" id="voice-btn" onclick="app.startVoiceSearch()"></i>
    </div>

    <nav id="category-bar"></nav>

    <main class="feed" id="main-feed"></main>

    <section class="comment-input-form">
        <h3>Bize Mesaj Gönder</h3>
        <input type="text" id="com-name" placeholder="Adın">
        <textarea id="com-text" rows="2" placeholder="Mesajın..."></textarea>
        <button onclick="app.addComment()">GÖNDER</button>
    </section>

    <div id="player">
        <div class="player-nav">
            <i class="fas fa-chevron-down" onclick="app.minimize()"></i>
            <span id="playing-title">Oynatılıyor...</span>
            <i class="fas fa-times" onclick="app.closePlayer()"></i>
        </div>
        <div id="player-box"></div>
        <div id="suggestion-list"></div>
    </div>

    <div id="admin-panel">
        <h1 style="color:red; text-align:center;">COMMAND CENTER</h1>
        <div class="admin-stats">
            <div class="s-card"><i class="fas fa-eye"></i><span id="stat-views">0</span><label>İZLENME</label></div>
            <div class="s-card"><i class="fas fa-envelope"></i><span id="stat-coms">0</span><label>MESAJ</label></div>
        </div>
        
        <div class="admin-card">
            <h3>SİSTEM AYARLARI</h3>
            <input type="text" id="edit-logo" class="adm-in" placeholder="Uygulama Adı">
            <input type="text" id="edit-key" class="adm-in" placeholder="YouTube API Key">
            <input type="password" id="edit-pass" class="adm-in" placeholder="Yeni Şifre">
            <input type="color" id="edit-color" class="adm-in">
            
            <h3>DUYURU YÖNETİMİ</h3>
            <input type="text" id="msg-input" class="adm-in" placeholder="Duyuru Mesajı">
            <input type="text" id="link-input" class="adm-in" placeholder="İndirme Linki">
            <label><input type="checkbox" id="ann-toggle"> Duyuruyu Yayınla</label>
            
            <button class="save-btn" onclick="app.saveSettings()">SİSTEMİ GÜNCELLE</button>
        </div>

        <div class="admin-card">
            <h3>GELEN MESAJLAR</h3>
            <div id="admin-comments-list"></div>
        </div>
        <button onclick="location.reload()" class="adm-in">PANELİ KAPAT</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
