<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNY TUBE ULTIMATE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="access-denied-screen">
        <div class="brain-content">
            <img src="https://i.pinimg.com/originals/f3/7b/d2/f37bd29f6358e72c86b72d25091c68f1.gif">
            <h2>ERİŞİM ENGELLENDİ</h2>
            <p>Shorts yetkisi bulunamadı. Kurtulmak için logoya tıkla.</p>
        </div>
    </div>

    <header>
        <h1 id="display-logo" onclick="app.unlockSystem()">BUNY</h1>
        <div class="header-icons">
            <i class="fas fa-bolt" onclick="app.blockShorts()"></i>
            <i class="fas fa-heart" onclick="app.showFavs()"></i>
            <i class="fas fa-crown" onclick="app.openLogin()"></i>
        </div>
    </header>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Video veya kanal ara..." onkeyup="if(event.key === 'Enter') app.fetchVideos(this.value)">
            <i class="fas fa-microphone" onclick="app.startVoiceSearch()"></i>
        </div>
    </div>

    <nav id="category-bar"></nav>
    <main id="main-feed" class="feed"></main>

    <div id="player">
        <div class="player-nav">
            <i class="fas fa-chevron-down" onclick="app.minimize()"></i>
            <span id="playing-title">Yükleniyor...</span>
            <i class="fas fa-times" onclick="app.closePlayer()"></i>
        </div>
        <div id="player-box"></div>
        <div class="player-info-bar">
            <span id="video-view-count"><i class="fas fa-eye"></i> 0 İzlenme</span>
            <button onclick="app.toggleFav()"><i class="fas fa-heart"></i> Favori</button>
        </div>
        <div id="suggestion-list"></div>
    </div>

    <div id="login-modal" class="modal-overlay">
        <div class="login-box">
            <h3>YETKİLİ GİRİŞİ</h3>
            <input type="password" id="admin-pass-input" placeholder="Şifre">
            <button onclick="app.checkLogin()">GİRİŞ YAP</button>
            <button onclick="app.closeLogin()" style="background:#222; margin-top:5px;">İPTAL</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
