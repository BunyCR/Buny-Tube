<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNY-Tube Premium Gold</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --red: #ff0000; --bg: #000; --card: #0f0f0f; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; padding-bottom: 70px; overflow-x: hidden; }

        /* HEADER & PROFIL */
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(0,0,0,0.9); z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 900; color: white; text-decoration: none; }
        .logo span { background: var(--red); padding: 2px 6px; border-radius: 6px; margin-left: 4px; }
        #user-avatar { width: 35px; height: 35px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--red); overflow: hidden; }
        #user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* PROFIL PANELI */
        .profile-modal { position: fixed; top: 0; right: -100%; width: 80%; height: 100%; background: #0f0f0f; z-index: 4000; transition: 0.4s; padding: 40px 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        .profile-modal.active { right: 0; }
        .close-profile { position: absolute; top: 15px; left: 15px; font-size: 1.5rem; }

        /* SHORTS TASARIMI */
        .shorts-container { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #000; z-index: 2500; display: none; }
        .short-video { width: 100%; height: 100%; position: relative; }
        .short-video iframe { width: 100%; height: 100%; pointer-events: none; }
        .short-overlay { position: absolute; bottom: 80px; left: 15px; z-index: 10; }
        .short-actions { position: absolute; bottom: 100px; right: 15px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .short-actions i { font-size: 1.8rem; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); }

        /* KLASIK VIDEO KARTLARI */
        #video-grid { padding: 10px; }
        .video-card { margin-bottom: 20px; }
        .video-card img { width: 100%; aspect-ratio: 16/9; border-radius: 12px; object-fit: cover; }
        .video-info { padding: 10px 0; }
        .video-info h3 { font-size: 0.9rem; margin-bottom: 5px; }

        /* NAVIGASYON */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #222; z-index: 3000; }
        .nav-item { color: #888; text-align: center; font-size: 0.7rem; cursor: pointer; }
        .nav-item.active { color: white; }
        .nav-item i { font-size: 1.4rem; display: block; margin-bottom: 4px; }

        /* MODALS */
        .player-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3500; display: none; flex-direction: column; }
    </style>
</head>
<body>

    <header class="header">
        <a href="#" class="logo" onclick="location.reload()">BUNY<span>Tube</span></a>
        <div id="user-avatar" onclick="toggleProfile()">
            <i class="fas fa-user"></i>
        </div>
    </header>

    <div id="video-grid"></div>

    <div id="shorts-screen" class="shorts-container">
        <div class="short-video" id="short-content">
            </div>
        <div class="short-actions">
            <i class="fas fa-heart" onclick="this.style.color='red'"></i>
            <i class="fas fa-comment"></i>
            <i class="fas fa-share"></i>
            <i class="fas fa-sync" onclick="loadShorts()"></i>
        </div>
        <div style="position:absolute; top:20px; left:20px;" onclick="closeShorts()"><i class="fas fa-arrow-left fa-lg"></i></div>
    </div>

    <div id="profile-modal" class="profile-modal">
        <i class="fas fa-times close-profile" onclick="toggleProfile()"></i>
        <div style="text-align:center; margin-top:30px;">
            <div id="p-img-area" style="width:100px; height:100px; border-radius:50%; background:#222; margin:0 auto 20px; overflow:hidden; border:3px solid var(--red);">
                <i class="fas fa-user fa-3x" style="margin-top:20px;"></i>
            </div>
            <h2 id="p-name">Misafir Kullanıcı</h2>
            <p style="color:#888; font-size:0.8rem; margin-bottom:30px;">Premium Üye</p>
            <button onclick="login()" style="width:100%; padding:15px; border-radius:30px; border:none; background:var(--red); color:white; font-weight:bold;">Giriş Yap / Değiştir</button>
            <div style="margin-top:20px; text-align:left; color:#ccc;">
                <p style="padding:10px 0; border-bottom:1px solid #222;"><i class="fas fa-cog"></i> Ayarlar</p>
                <p style="padding:10px 0; border-bottom:1px solid #222;"><i class="fas fa-shield-alt"></i> Güvenlik</p>
                <p style="padding:10px 0;" onclick="alert('BUNY-Tube V11.0')"><i class="fas fa-info-circle"></i> Hakkında</p>
            </div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="loadHome()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item" onclick="loadShorts()"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-item" onclick="loadLibrary()"><i class="fas fa-video"></i>Kitaplık</div>
    </nav>

    <div id="player" class="player-overlay">
        <div style="padding:15px;" onclick="closePlayer()"><i class="fas fa-chevron-down"></i> Kapat</div>
        <div id="main-frame"></div>
        <div id="p-info" style="padding:15px;"></div>
    </div>

    <script>
        const API_KEY = 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0';
        
        // --- PROFIL SISTEMI ---
        let userData = JSON.parse(localStorage.getItem('buny_user')) || {name: "Misafir Kullanıcı", img: ""};
        function updateProfileUI() {
            document.getElementById('p-name').innerText = userData.name;
            if(userData.img) {
                document.getElementById('user-avatar').innerHTML = `<img src="${userData.img}">`;
                document.getElementById('p-img-area').innerHTML = `<img src="${userData.img}">`;
            }
        }
        function login() {
            let n = prompt("Adın ne kanka?");
            let p = prompt("Profil resmi URL'si (Boş bırakabilirsin):");
            if(n) {
                userData = {name: n, img: p || ""};
                localStorage.setItem('buny_user', JSON.stringify(userData));
                updateProfileUI();
            }
        }
        function toggleProfile() { document.getElementById('profile-modal').classList.toggle('active'); }

        // --- ANA SAYFA ---
        async function loadHome() {
            closeShorts();
            const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=TR&maxResults=10&key=${API_KEY}`);
            const data = await res.json();
            const grid = document.getElementById('video-grid');
            grid.innerHTML = "";
            data.items.forEach(v => {
                grid.innerHTML += `
                    <div class="video-card" onclick="openVideo('${v.id}')">
                        <img src="${v.snippet.thumbnails.high.url}">
                        <div class="video-info"><h3>${v.snippet.title}</h3><p>${v.snippet.channelTitle}</p></div>
                    </div>`;
            });
            updateNav(0);
        }

        // --- SHORTS SISTEMI ---
        async function loadShorts() {
            document.getElementById('shorts-screen').style.display = 'block';
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=shorts&type=video&videoDuration=short&maxResults=20&key=${API_KEY}`);
            const data = await res.json();
            const randomShort = data.items[Math.floor(Math.random() * data.items.length)];
            document.getElementById('short-content').innerHTML = `
                <iframe src="https://www.youtube.com/embed/${randomShort.id.videoId}?autoplay=1&controls=0&loop=1&playlist=${randomShort.id.videoId}" frameborder="0"></iframe>
                <div class="short-overlay"><h3>${randomShort.snippet.title}</h3><p>${randomShort.snippet.channelTitle}</p></div>`;
            updateNav(1);
        }
        function closeShorts() { document.getElementById('shorts-screen').style.display = 'none'; }

        // --- DIGERLERI ---
        function openVideo(id) {
            document.getElementById('player').style.display = 'flex';
            document.getElementById('main-frame').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" style="width:100%; aspect-ratio:16/9;" frameborder="0" allowfullscreen></iframe>`;
        }
        function closePlayer() { document.getElementById('player').style.display = 'none'; document.getElementById('main-frame').innerHTML = ""; }
        function loadLibrary() { alert("Kitaplığın Hazırlanıyor!"); updateNav(2); }
        function updateNav(i) { document.querySelectorAll('.nav-item').forEach((n,idx) => n.classList.toggle('active', i===idx)); }

        window.onload = () => { loadHome(); updateProfileUI(); };
    </script>
</body>
</html>
