<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUNY-Tube V8000 | Muhammed Ali Pro</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <style>
        /* [1. CSS MASTER SYSTEM - NEUMORPHIC DARK THEME] */
        :root {
            --m-red: #ff0000;
            --m-black: #000000;
            --m-surface: #0a0a0a;
            --m-surface-2: #141414;
            --m-border: #222222;
            --m-text: #ffffff;
            --m-text-dim: #999999;
            --m-glow: 0 0 25px rgba(255, 0, 0, 0.4);
            --m-ease: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--m-black); color: var(--m-text); overflow-x: hidden; padding-bottom: 120px; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { display: none; }

        /* [ANIMATIONS] */
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes glowPulse { 0% { box-shadow: 0 0 5px var(--m-red); } 50% { box-shadow: 0 0 20px var(--m-red); } 100% { box-shadow: 0 0 5px var(--m-red); } }

        /* [SHORTS LOCK] */
        #shorts-lock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 100000; display: none;
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px;
        }
        .lock-card { border: 2px solid var(--m-red); padding: 50px 30px; border-radius: 40px; background: var(--m-surface); box-shadow: var(--m-glow); animation: slideUp 0.5s var(--m-ease); }
        .lock-card i { font-size: 4rem; color: var(--m-red); margin-bottom: 20px; }

        /* [HEADER] */
        header {
            position: sticky; top: 0; z-index: 50000;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(30px);
            padding: 20px; border-bottom: 1px solid var(--m-border);
        }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900; letter-spacing: -1px; }
        .logo span { background: var(--m-red); padding: 2px 10px; border-radius: 8px; margin-left: 5px; box-shadow: var(--m-glow); }
        .crown { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--m-red); display: flex; align-items: center; justify-content: center; color: var(--m-red); }

        .search-bar { display: flex; gap: 10px; }
        .input-wrap { flex: 1; background: var(--m-surface-2); border: 1px solid var(--m-border); border-radius: 50px; padding: 12px 20px; display: flex; align-items: center; }
        .input-wrap input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 1rem; }
        .voice-btn { width: 48px; height: 48px; background: var(--m-surface-2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--m-red); border: 1px solid var(--m-border); }

        /* [FEED GRID] */
        .grid { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 15px; }
        .card { background: transparent; margin-bottom: 25px; cursor: pointer; animation: slideUp 0.8s var(--m-ease) forwards; }
        .thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 15px; border: 1px solid var(--m-border); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; transition: 1s var(--m-ease); }
        .card:hover .thumb img { transform: scale(1.05); }
        
        .meta { display: flex; padding: 15px 5px; gap: 15px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--m-border); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; flex-shrink: 0; text-transform: uppercase; }
        .info h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 5px; }
        .info p { color: var(--m-text-dim); font-size: 0.85rem; font-weight: 500; }

        /* [MINI PLAYER DOCK - THE ULTIMATE BRIDGE] */
        #mini-dock {
            position: fixed; bottom: 110px; right: 15px; width: 230px; aspect-ratio: 16/9;
            z-index: 100001; border: 2px solid var(--m-red); border-radius: 15px;
            overflow: hidden; background: #000; display: none; box-shadow: var(--m-glow);
            transition: 0.4s var(--m-ease);
        }
        .mini-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .mini-close { position: absolute; top: 8px; right: 8px; background: var(--m-red); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; z-index: 20; }

        /* [FULL PLAYER OVERLAY] */
        #player-ui {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100000; display: none; flex-direction: column;
        }
        .p-nav { padding: 15px 20px; background: var(--m-surface); border-bottom: 1px solid var(--m-border); display: flex; align-items: center; gap: 15px; font-weight: 800; cursor: pointer; }
        .p-video { width: 100%; aspect-ratio: 16/9; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .p-details { flex: 1; overflow-y: auto; padding: 25px; }

        /* [NAV BAR] */
        nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.98);
            border-top: 1px solid var(--m-border); display: flex; justify-content: space-around;
            padding: 15px 0 calc(25px + env(safe-area-inset-bottom)); z-index: 50000;
        }
        .nav-item { text-align: center; color: #555; font-size: 0.8rem; font-weight: 900; }
        .nav-item.active { color: #fff; }
        .nav-item i { display: block; font-size: 1.8rem; margin-bottom: 6px; }

        @media (min-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 20px; } }
    </style>
</head>
<body>

    <div id="shorts-lock">
        <div class="lock-card">
            <i class="fas fa-shield-virus"></i>
            <h2 style="font-family:'Orbitron'">BUNY PROTECT</h2>
            <p style="margin:20px 0; color:#888;">Shorts izlemek odak gücünü yok eder kanka. <br> Muhammed Ali seni uzun videolara yönlendiriyor!</p>
            <button onclick="master.ui.toggleShorts(false)" style="background:var(--m-red); color:#fff; border:none; padding:15px 40px; border-radius:15px; font-weight:900; cursor:pointer;">TAMAM KRAL</button>
        </div>
    </div>

    <div id="mini-dock">
        <div class="mini-close" onclick="master.ui.killPlayer()"><i class="fas fa-times"></i></div>
        <div class="mini-overlay" onclick="master.ui.expandPlayer()"></div>
        <div id="dock-target" style="width:100%; height:100%;"></div>
    </div>

    <header>
        <div class="top-row">
            <div class="logo" onclick="master.engine.goHome()">BUNY<span>Tube</span></div>
            <div class="crown"><i class="fas fa-crown"></i></div>
        </div>
        <div class="search-bar">
            <div class="input-wrap">
                <input type="text" id="m-query" placeholder="Sistemi Ara..." onkeypress="if(event.key==='Enter') master.engine.runSearch()">
                <i class="fas fa-search" style="opacity:0.2"></i>
            </div>
            <div class="voice-btn" onclick="master.engine.voice()"><i class="fas fa-microphone"></i></div>
        </div>
    </header>

    <main class="grid" id="main-feed"></main>

    <div id="player-ui">
        <div class="p-nav" onclick="master.ui.minimizePlayer()">
            <i class="fas fa-chevron-down"></i> VİDEOYU SİSTEME SABİTLE (KÜÇÜLT)
        </div>
        <div id="full-target" class="p-video"></div>
        <div class="p-details">
            <h2 id="p-title" style="margin-bottom:20px; font-size:1.2rem; font-weight:800;"></h2>
            <hr style="border:0; border-top:1px solid #222; margin-bottom:25px;">
            <div class="grid" id="related-feed" style="padding:0;"></div>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="master.engine.goHome()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item" onclick="master.ui.toggleShorts(true)"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-item"><i class="fas fa-fire"></i>Trendler</div>
    </nav>

    <script>
        /* [THE MASTER ENGINE V8000] */
        const master = {
            state: { activeId: null, activeTitle: null, isMini: false },
            config: {
                key: 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0',
                colors: ['#ff4b2b', '#1a73e8', '#00c851', '#aa66cc', '#ffbb33', '#33b5e5'],
                // [YEDEK HAVUZ - 20 VİDEO]
                pool: [
                    {id: 'WpAbtdX5WuU', t: '2026 Mars Hayali Çöktü mü? - Starship', c: 'Barış Özcan'},
                    {id: 'DRMy3mRgW6Y', t: 'Amazon Kuiper: 2026 Uydu İnterneti', c: 'Teknoloji TV'},
                    {id: 'lXr19zpQ4h0', t: 'Çin 2050 Teknolojisini Yaşıyor🚀', c: 'Global Tech'},
                    {id: 'GWltQO23mQw', t: 'En Korkutucu 3 Uzay Gerçeği', c: 'Galaktot'},
                    {id: 'ScaQdZmpTQw', t: '4 Milyar Yıl Önce Gezegenler', c: 'Bilim Hattı'},
                    {id: 'N7J3fV7-0lE', t: 'Dünyanın En Hızlı 10 Motosikleti (2026)', c: 'MotorLife'},
                    {id: 'uD4izuDMUQA', t: 'BMW Vision Neue Klasse 2026 İnceleme', c: 'AutoTrend'},
                    {id: 'xR8XfWnS9fU', t: 'Cyberpunk 2077 Değil, Tokyo 2026!', c: 'TravelerX'},
                    {id: 'v64m_9D8pY0', t: 'Yapay Zeka ChatGPT-6 Neler Yapabiliyor?', c: 'AI Watch'},
                    {id: 'HlBAH2YZ05w', t: 'Mars Kolonisi İçin İlk Modüler Evler', c: 'SpaceDesign'},
                    {id: '4izuDMUQAud', t: 'Apple Car 2026: Sızdırılan Görüntüler', c: 'iNews'},
                    {id: 'Y3fV7-0lEN7', t: 'Kuantum Bilgisayarlar ve Şifreleme Devrimi', c: 'FutureTech'},
                    {id: '5wHlBAH2YZ0', t: 'Uzay İstasyonunda Bir Gün: Alper Gezeravcı', c: 'Uzay Ajansı'},
                    {id: 'uD4izuDMUQA', t: 'Elektrikli Araçlarda Batarya Devrimi 2026', c: 'EnergyX'}
                ]
            },

            ui: {
                toggleShorts: (s) => document.getElementById('shorts-lock').style.display = s ? 'flex' : 'none',
                
                // [BRIDGE LOGIC: SESİ KESEN VE VİDEOYU TAŞIYAN ANA SİSTEM]
                minimizePlayer: function() {
                    const id = master.state.activeId;
                    if(!id) return;

                    // 1. Ana oynatıcıdaki iframe'i tamamen DOM'dan sil (SES ANINDA KESİLİR)
                    document.getElementById('full-target').innerHTML = "";
                    document.getElementById('player-ui').style.display = 'none';

                    // 2. Mini dock'ı aktif et ve oraya yeni iframe kur
                    document.getElementById('mini-dock').style.display = 'block';
                    document.getElementById('dock-target').innerHTML = master.engine.getFrame(id);
                    master.state.isMini = true;
                },

                expandPlayer: function() {
                    const id = master.state.activeId;
                    // 1. Mini dock'taki iframe'i sil
                    document.getElementById('dock-target').innerHTML = "";
                    document.getElementById('mini-dock').style.display = 'none';

                    // 2. Ana oynatıcıya geri kur
                    document.getElementById('player-ui').style.display = 'flex';
                    document.getElementById('full-target').innerHTML = master.engine.getFrame(id);
                    master.state.isMini = false;
                },

                killPlayer: function() {
                    document.getElementById('dock-target').innerHTML = "";
                    document.getElementById('mini-dock').style.display = 'none';
                    master.state.activeId = null;
                }
            },

            engine: {
                goHome: function() {
                    this.fetch("2026 teknoloji inceleme");
                    window.scrollTo(0,0);
                },
                runSearch: function() {
                    const q = document.getElementById('m-query').value;
                    if(q) this.fetch(q);
                },
                getFrame: (id) => `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1&rel=0" style="width:100%; height:100%; border:none;" allow="autoplay; fullscreen"></iframe>`,
                
                fetch: async function(q) {
                    const box = document.getElementById('main-feed');
                    box.innerHTML = `<div style="padding:100px; text-align:center; grid-column:1/-1;"><i class="fas fa-circle-notch fa-spin fa-3x" style="color:red"></i></div>`;
                    
                    try {
                        const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&maxResults=15&key=${master.config.key}`);
                        const d = await r.json();
                        box.innerHTML = "";
                        d.items.forEach(v => this.render(box, v.id.videoId, v.snippet.title, v.snippet.channelTitle));
                    } catch(e) {
                        box.innerHTML = "";
                        master.config.pool.sort(() => 0.5 - Math.random()).forEach(v => this.render(box, v.id, v.t, v.c));
                    }
                },

                render: function(box, id, title, chan) {
                    const color = master.config.colors[Math.floor(Math.random() * master.config.colors.length)];
                    const letter = chan.charAt(0);
                    // [SMART THUMBNAIL FALLBACK]
                    const thumb = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

                    box.innerHTML += `
                        <div class="card" onclick="master.engine.play('${id}', '${title.replace(/'/g,"")}')">
                            <div class="thumb">
                                <img src="${thumb}" onerror="this.src='https://img.youtube.com/vi/${id}/0.jpg'">
                            </div>
                            <div class="meta">
                                <div class="avatar" style="background:${color}">${letter}</div>
                                <div class="info">
                                    <h3>${title}</h3>
                                    <p>${chan} • 2026 Muhammed Ali</p>
                                </div>
                            </div>
                        </div>`;
                },

                play: function(id, title) {
                    master.state.activeId = id;
                    document.getElementById('player-ui').style.display = 'flex';
                    document.getElementById('p-title').innerText = title;
                    document.getElementById('full-target').innerHTML = this.getFrame(id);
                    document.getElementById('mini-dock').style.display = 'none';
                    this.fetchRelated();
                },

                fetchRelated: function() {
                    const box = document.getElementById('related-feed');
                    box.innerHTML = "";
                    master.config.pool.slice(0, 6).sort(() => 0.5 - Math.random()).forEach(v => this.render(box, v.id, v.t, v.c));
                },

                voice: function() {
                    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if(!SR) return;
                    const rec = new SR(); rec.lang = 'tr-TR';
                    rec.onresult = (e) => {
                        document.getElementById('m-query').value = e.results[0][0].transcript;
                        this.runSearch();
                    };
                    rec.start();
                }
            }
        };

        window.onload = () => master.engine.goHome();
    </script>
</body>
</html>
