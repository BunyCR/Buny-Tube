<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNY-Tube Premium</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo">BUNY<span>Tube</span></div>
        <div class="nav-icons">
            <i class="fas fa-cast" style="margin-right: 15px;"></i>
            <i class="fas fa-bell"></i>
        </div>
    </header>

    <div class="promo-banner">VPN AKTİF: REKLAMLAR ENGELLENDİ</div>

    <div class="categories" id="category-bar">
        <div class="cat-item active" onclick="selectCategory(this, '')">Hepsi</div>
        <div class="cat-item" onclick="selectCategory(this, 'Oyun')">Oyun</div>
        <div class="cat-item" onclick="selectCategory(this, 'Müzik')">Müzik</div>
        <div class="cat-item" onclick="selectCategory(this, 'Eğlence')">Eğlence</div>
        <div class="cat-item" onclick="selectCategory(this, 'Eğitim')">Eğitim</div>
        <div class="cat-item" onclick="selectCategory(this, 'Clash Royale')">CR</div>
    </div>

    <div class="search-area">
        <div class="search-wrapper">
            <input type="text" id="search-input" placeholder="YouTube'da keşfe çık...">
            <i class="fas fa-search" onclick="search()" style="color: #ff0000; cursor: pointer;"></i>
        </div>
    </div>

    <main id="video-grid">
        </main>

    <div id="player" class="player-overlay">
        <div class="player-header" onclick="closeVideo()">
            <i class="fas fa-chevron-down"></i>
            <span id="player-title">Oynatılıyor...</span>
        </div>
        <div id="iframe-container"></div>
        <div class="player-details">
            <h2 id="v-title-full">Video Başlığı</h2>
            <p id="v-stats" style="color: #aaa; font-size: 0.8rem; margin-top: 5px;"></p>
            <button class="download-btn" onclick="downloadVideo()">
                <i class="fas fa-download"></i> ÜCRETSİZ İNDİR
            </button>
        </div>
    </div>

    <nav class="nav-bar">
        <a href="#" class="nav-item active" onclick="loadHome()"><i class="fas fa-home"></i><span>Ana Sayfa</span></a>
        <a href="#" class="nav-item" onclick="loadShorts()"><i class="fas fa-bolt"></i><span>Shorts</span></a>
        <a href="#" class="nav-item"><i class="fas fa-plus-circle fa-2x"></i></a>
        <a href="#" class="nav-item" onclick="alert('Abonelikler yakında!')"><i class="fas fa-layer-group"></i><span>Abonelik</span></a>
        <a href="#" class="nav-item" onclick="alert('Kitaplık yakında!')"><i class="fas fa-video"></i><span>Kitaplık</span></a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
