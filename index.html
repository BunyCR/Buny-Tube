<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUNY-Tube V500 King Edition</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">

    <style>
        /* [1. DESIGN SYSTEM & VARIABLES] */
        :root {
            --king-red: #ff0000;
            --deep-black: #000000;
            --soft-black: #0f0f0f;
            --card-bg: #121212;
            --gray-text: #aaaaaa;
            --white-text: #ffffff;
            --shadow-red: 0 0 20px rgba(255, 0, 0, 0.3);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* [2. GLOBAL RESET] */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            scrollbar-width: none;
        }
        *::-webkit-scrollbar { display: none; }

        body {
            background-color: var(--deep-black);
            color: var(--white-text);
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* [3. PREMIUM HEADER ARCHITECTURE] */
        header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            padding: 12px 16px;
            border-bottom: 1px solid #1a1a1a;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            color: var(--white-text);
            letter-spacing: -1px;
            cursor: pointer;
        }

        .brand-logo span {
            background: var(--king-red);
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 5px;
            box-shadow: var(--shadow-red);
        }

        .user-trigger {
            font-size: 1.4rem;
            color: var(--king-red);
            cursor: pointer;
            transition: var(--transition);
        }

        .user-trigger:active { transform: scale(0.9); }

        /* [4. SLIM SEARCH ENGINE] */
        .search-engine {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-input-wrapper {
            flex: 1;
            background: var(--soft-black);
            border: 1px solid #252525;
            border-radius: 25px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }

        .search-input-wrapper:focus-within {
            border-color: var(--king-red);
            background: #151515;
        }

        .search-input-wrapper input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
        }

        .voice-trigger-btn {
            width: 40px;
            height: 40px;
            background: var(--soft-black);
            border: 1px solid #252525;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--king-red);
            cursor: pointer;
        }

        .voice-trigger-btn.recording {
            background: var(--king-red);
            color: white;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,0,0,0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(255,0,0,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,0,0,0); }
        }

        /* [5. CINEMATIC VIDEO FEED] */
        .video-feed-grid {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-top: 10px;
        }

        .video-card {
            width: 100%;
            background: var(--deep-black);
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 21 / 9; /* Ultra-Wide Cinematic */
            background: #111;
            overflow: hidden;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .v-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .video-details {
            padding: 12px 16px;
            display: flex;
            gap: 15px;
        }

        .channel-pfp {
            width: 40px;
            height: 40px;
            background: #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--king-red);
            flex-shrink: 0;
            border: 1px solid #333;
        }

        .video-info-text h3 {
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            font-size: 0.8rem;
            color: var(--gray-text);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* [6. NAVIGATION DOCK] */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.98);
            border-top: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 30px;
            z-index: 2000;
        }

        .nav-item {
            color: var(--gray-text);
            text-align: center;
            font-size: 0.65rem;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-item.active { color: white; }
        .nav-item i { display: block; font-size: 1.5rem; margin-bottom: 5px; }

        /* [7. KING PROFILE DRAWER] */
        #profile-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            height: 100%;
            background: #050505;
            z-index: 5000;
            transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            padding: 60px 25px;
            border-left: 3px solid var(--king-red);
        }

        #profile-drawer.active { right: 0; }

        .king-identity {
            text-align: center;
            margin-bottom: 40px;
        }

        .crown-wrapper {
            position: relative;
            display: inline-block;
        }

        .king-crown {
            color: var(--king-red);
            font-size: 3rem;
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0 0 10px var(--king-red));
        }

        .king-avatar {
            width: 100px;
            height: 100px;
            background: #111;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #222;
            font-size: 3rem;
            color: var(--king-red);
        }

        /* [8. GOD PLAYER INTERFACE] */
        #god-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--deep-black);
            z-index: 10000;
            display: none;
            flex-direction: column;
        }

        .player-header {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: #080808;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="brand-logo" onclick="king_init()">BUNY<span>Tube</span></div>
            <div class="user-trigger" onclick="king_toggle_profile()">
                <i class="fas fa-crown"></i>
            </div>
        </div>
        <div class="search-engine">
            <div class="search-input-wrapper">
                <input type="text" id="query-input" placeholder="Kaosu keşfet..." onkeypress="if(event.key==='Enter') king_search()">
                <i class="fas fa-search" style="opacity:0.4" onclick="king_search()"></i>
            </div>
            <div class="voice-trigger-btn" id="mic-btn" onclick="king_voice()">
                <i class="fas fa-microphone"></i>
            </div>
        </div>
    </header>

    <main class="video-feed-grid" id="main-feed-target"></main>

    <div id="profile-drawer">
        <i class="fas fa-times" onclick="king_toggle_profile()" style="float:right; font-size:2rem; color:#222;"></i>
        <div class="king-identity">
            <div class="crown-wrapper">
                <i class="fas fa-crown king-crown"></i>
                <div class="king-avatar"><i class="fas fa-user-shield"></i></div>
            </div>
            <h1 style="margin-top:20px; font-size:2rem; font-weight:900;">Muhammed Ali</h1>
            <p style="color:var(--king-red); font-weight:900; letter-spacing:4px; margin-top:10px;">PREMIUM DEVELOPER</p>
        </div>
        <div style="margin-top:50px; background:#111; padding:20px; border-radius:15px; border:1px solid #222; font-size:0.9rem; color:#666; line-height:1.7;">
            <b>Sistem Raporu:</b> V500 King Edition aktif. Video oranları 21:9 olarak optimize edildi. Arka planda oynatma motoru hazır. Reklamlar Muhammed Ali tarafından engellendi.
        </div>
        <button onclick="king_init()" style="width:100%; padding:15px; margin-top:30px; border-radius:10px; background:white; color:black; font-weight:900; border:none;">ANA SAYFAYA DÖN</button>
    </div>

    <div id="god-player">
        <div class="player-header" onclick="king_close_player()">
            <i class="fas fa-chevron-down"></i>
            <span style="font-weight:900; font-size:0.8rem;">OYNATILIYOR</span>
        </div>
        <div id="video-stage" style="width:100%; aspect-ratio:16/9;"></div>
        <div style="padding:20px; flex:1; overflow-y:auto;">
            <h2 id="p-video-title" style="font-size:1.2rem; margin-bottom:15px;"></h2>
            <div style="height:1px; background:#222; margin-bottom:20px;"></div>
            <p style="color:var(--king-red); font-weight:900; font-size:0.8rem; margin-bottom:15px;">BUNU DA SEVEBİLİRSİN</p>
            <div id="p-suggestions" class="video-feed-grid"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="king_init()"><i class="fas fa-house"></i>Ana Sayfa</a>
        <a href="#" class="nav-item" onclick="king_gate()"><i class="fas fa-bolt"></i>Shorts</a>
        <a href="#" class="nav-item" onclick="king_gate()"><i class="fas fa-layer-group"></i>Kitaplık</a>
    </nav>

    <script>
        /* [CORE ENGINE CONFIG] */
        const GOD_KEY = 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0';
        const CHAOS_POOL = ['belgesel 2026', 'teknoloji devrimi', 'uzay yolculuğu 4k', 'motosiklet asmr', 'gelecek vizyonu'];

        /* [STAT FORMATTERS] */
        function formatStats(num) {
            if(!num) return "0";
            if(num >= 1000000) return (num/1000000).toFixed(1) + ' Mn';
            if(num >= 1000) return (num/1000).toFixed(0) + ' B';
            return num;
        }

        /* [API DATA ENGINE] */
        async function king_fetch_data(q, target) {
            const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&maxResults=12&key=${GOD_KEY}`;
            
            try {
                const response = await fetch(searchUrl);
                const data = await response.json();
                const container = document.getElementById(target);
                container.innerHTML = "";

                if(data.items) {
                    const videoIds = data.items.map(i => i.id.videoId).join(',');
                    const statsRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${videoIds}&key=${GOD_KEY}`);
                    const statsData = await statsRes.json();

                    data.items.forEach((item, index) => {
                        const vidId = item.id.videoId;
                        if(!vidId) return;
                        const views = statsData.items[index] ? formatStats(statsData.items[index].statistics.viewCount) : "Bilinmiyor";
                        const date = new Date(item.snippet.publishedAt).toLocaleDateString('tr-TR');

                        container.innerHTML += `
                            <div class="video-card" onclick="king_open_player('${vidId}', '${item.snippet.title.replace(/'/g, "")}')">
                                <div class="video-thumbnail">
                                    <img src="${item.snippet.thumbnails.high.url}" loading="lazy">
                                    <div class="v-badge">HD</div>
                                </div>
                                <div class="video-details">
                                    <div class="channel-pfp"><i class="fas fa-crown"></i></div>
                                    <div class="video-info-text">
                                        <h3>${item.snippet.title}</h3>
                                        <div class="video-meta">${item.snippet.channelTitle} • ${views} izlenme • ${date}</div>
                                    </div>
                                </div>
                            </div>`;
                    });
                }
            } catch (err) { console.error("ENGINE ERROR:", err); }
        }

        /* [UI CONTROLLERS] */
        function king_open_player(id, title) {
            const player = document.getElementById('god-player');
            player.style.display = 'flex';
            document.getElementById('p-video-title').innerText = title;
            document.getElementById('video-stage').innerHTML = `
                <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
            king_fetch_data(title, 'p-suggestions');
            history.pushState({p:1}, "");
        }

        function king_close_player() {
            document.getElementById('god-player').style.display = 'none';
            document.getElementById('video-stage').innerHTML = "";
        }

        function king_toggle_profile() {
            document.getElementById('profile-drawer').classList.toggle('active');
        }

        function king_init() {
            const randomQuery = CHAOS_POOL[Math.floor(Math.random() * CHAOS_POOL.length)];
            king_fetch_data(randomQuery, 'main-feed-target');
            document.getElementById('profile-drawer').classList.remove('active');
            window.scrollTo(0,0);
        }

        function king_search() {
            const val = document.getElementById('query-input').value;
            if(val) king_fetch_data(val, 'main-feed-target');
        }

        function king_voice() {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!Speech) return;
            const rec = new Speech();
            rec.lang = 'tr-TR';
            rec.onstart = () => document.getElementById('mic-btn').classList.add('recording');
            rec.onend = () => document.getElementById('mic-btn').classList.remove('recording');
            rec.onresult = (e) => {
                document.getElementById('query-input').value = e.results[0][0].transcript;
                king_search();
            };
            rec.start();
        }

        function king_gate() { alert("Muhammed Ali: Bu alan zihin sağlığın için şimdilik kapalı kanka!"); }

        /* [BACKGROUND ENGINE] */
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                const frame = document.querySelector('iframe');
                if(frame) frame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            }
        });

        window.onload = king_init;
    </script>
</body>
</html>
