<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUNY-Tube V6500 | Supreme Absolute</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@700;800;900&family=JetBrains+Mono:wght@400&family=Syncopate:wght@700&display=swap" rel="stylesheet">

    <style>
        /* [1. CSS MASTER SYSTEM - APPROX 350 LINES] 
           DESIGN LANGUAGE: "NEO-IMPERIAL DARK"
        */
        :root {
            --m-red: #ff0000;
            --m-red-dark: #8b0000;
            --m-red-glow: rgba(255, 0, 0, 0.4);
            --m-black: #000000;
            --m-bg: #030303;
            --m-surface-1: #0a0a0a;
            --m-surface-2: #121212;
            --m-surface-3: #1c1c1c;
            --m-border: #222222;
            --m-border-light: #333333;
            --m-text: #ffffff;
            --m-text-secondary: #aaaaaa;
            --m-text-dim: #666666;
            --m-font-main: 'Inter', sans-serif;
            --m-font-logo: 'Orbitron', sans-serif;
            --m-transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            --m-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        
        html, body {
            width: 100%; height: 100%;
            background: var(--m-black);
            color: var(--m-text);
            font-family: var(--m-font-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* [ANIMATIONS] */
        @keyframes revealUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes rotateCrown { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes expandRing { 0% { transform: scale(0.8); opacity: 0; } 50% { opacity: 0.3; } 100% { transform: scale(1.5); opacity: 0; } }

        /* [UI: SHORTS SHIELD SYSTEM] */
        #shield-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.99); z-index: 999999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px; backdrop-filter: blur(20px);
        }
        .shield-content {
            background: var(--m-surface-1); border: 2px solid var(--m-red);
            border-radius: 40px; padding: 60px 30px; max-width: 500px;
            box-shadow: 0 0 60px var(--m-red-glow); position: relative;
        }
        .shield-icon { font-size: 5rem; color: var(--m-red); margin-bottom: 30px; animation: pulse 2s infinite ease-in-out; }
        .shield-title { font-family: var(--m-font-logo); font-size: 1.8rem; margin-bottom: 20px; letter-spacing: 2px; }
        .shield-desc { color: var(--m-text-secondary); line-height: 1.7; margin-bottom: 40px; }
        .shield-btn {
            width: 100%; padding: 22px; background: var(--m-red); color: #fff;
            border: none; border-radius: 20px; font-weight: 900; font-size: 1.2rem;
            cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;
        }
        .shield-btn:active { transform: scale(0.95); background: var(--m-red-dark); }

        /* [UI: HEADER & SEARCH] */
        header {
            position: sticky; top: 0; z-index: 50000;
            background: rgba(3,3,3,0.9); backdrop-filter: blur(40px);
            border-bottom: 1px solid var(--m-border); padding: 20px;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo-wrap { font-family: var(--m-font-logo); font-size: 2rem; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .logo-wrap:active { transform: scale(0.9); }
        .logo-wrap span { background: var(--m-red); padding: 2px 12px; border-radius: 12px; margin-left: 8px; box-shadow: var(--m-glow); }
        .crown-btn { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--m-red); display: flex; align-items: center; justify-content: center; color: var(--m-red); font-size: 1.5rem; cursor: pointer; position: relative; }
        .crown-btn::after { content: ''; position: absolute; width: 100%; height: 100%; border: 2px solid var(--m-red); border-radius: 50%; animation: expandRing 2s infinite; }

        .search-row { display: flex; gap: 15px; }
        .input-group {
            flex: 1; background: var(--m-surface-2); border: 1px solid var(--m-border);
            border-radius: 50px; padding: 15px 25px; display: flex; align-items: center;
            transition: var(--m-transition);
        }
        .input-group:focus-within { border-color: var(--m-red); box-shadow: 0 0 20px rgba(255,0,0,0.1); }
        .input-group input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 1.1rem; font-weight: 500; }
        .voice-btn { width: 55px; height: 55px; background: var(--m-surface-2); border: 1px solid var(--m-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--m-red); font-size: 1.3rem; cursor: pointer; transition: 0.3s; }

        /* [UI: DYNAMIC GRID] */
        .content-area { padding: 15px; display: grid; grid-template-columns: 1fr; gap: 10px; }
        .video-entry { background: transparent; margin-bottom: 30px; cursor: pointer; animation: revealUp 0.8s var(--m-ease) forwards; }
        .thumb-container {
            position: relative; width: 100%; aspect-ratio: 16 / 9;
            background: #080808; border-radius: 18px; overflow: hidden;
            border: 1px solid var(--m-border);
        }
        .thumb-container img { width: 100%; height: 100%; object-fit: cover; transition: 1.5s var(--m-ease); }
        .video-entry:hover .thumb-container img { transform: scale(1.1); }
        .badge-2026 { position: absolute; top: 15px; left: 15px; background: var(--m-red); color: #fff; padding: 5px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 900; box-shadow: var(--m-glow); }
        .duration-tag { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.85); color: #fff; padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; border: 1px solid #333; }

        .meta-container { display: flex; padding: 18px 5px; gap: 18px; }
        .chan-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--m-red); flex-shrink: 0; background: var(--m-surface-3); }
        .text-group h3 { font-size: 1.1rem; font-weight: 700; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .text-group p { color: var(--m-text-secondary); font-size: 0.9rem; font-weight: 500; }

        /* [UI: THE SUPREME PLAYER BRIDGE] */
        #player-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100000; display: none; flex-direction: column;
            animation: fadeIn 0.4s ease;
        }
        .player-header { padding: 22px; display: flex; align-items: center; gap: 20px; font-weight: 900; background: var(--m-surface-1); border-bottom: 1px solid var(--m-border); cursor: pointer; }
        .iframe-stage { width: 100%; aspect-ratio: 16 / 9; background: #000; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .player-scroller { flex: 1; overflow-y: auto; padding: 25px; }

        /* [UI: PERSISTENCE DOCK (MINI-PLAYER)] */
        #mini-dock {
            position: fixed; bottom: 120px; right: 20px; width: 220px; aspect-ratio: 16 / 9;
            z-index: 100001; border: 3px solid var(--m-red); border-radius: 20px;
            background: #000; overflow: hidden; display: none; box-shadow: var(--m-shadow);
            transition: 0.5s var(--m-ease); transform: scale(0);
        }
        #mini-dock.active { transform: scale(1); }
        .mini-hitbox { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .mini-x { position: absolute; top: 10px; right: 10px; background: var(--m-red); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 20; font-size: 0.8rem; font-weight: 900; cursor: pointer; }

        /* [UI: BOTTOM NAVIGATION] */
        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(5,5,5,0.98); backdrop-filter: blur(30px);
            border-top: 1px solid var(--m-border); display: flex; justify-content: space-around;
            padding: 20px 0 calc(25px + env(safe-area-inset-bottom)); z-index: 50000;
        }
        .nav-btn { text-align: center; color: #444; font-size: 0.8rem; font-weight: 900; transition: 0.3s; cursor: pointer; }
        .nav-btn.active { color: #fff; text-shadow: 0 0 10px var(--m-red-glow); }
        .nav-btn i { display: block; font-size: 1.8rem; margin-bottom: 8px; }

        /* [TABLET & DESKTOP ENHANCEMENTS] */
        @media (min-width: 768px) {
            .content-area { grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 30px; }
            .thumb-container { aspect-ratio: 21 / 9; }
        }
    </style>
</head>
<body>

    <div id="shield-overlay">
        <div class="shield-content">
            <i class="fas fa-microchip shield-icon"></i>
            <h2 class="shield-title">PROTOCOL: ANTI-SHORTS</h2>
            <p class="shield-desc">
                Muhammed Ali Güvenlik Sistemi devrede. 60 saniyelik boş videolar yerine, 
                zihnini geliştirecek derin içeriklere odaklanman için Shorts alanı mühürlendi. 
                Geleceği inşa et kanka, kaydırma!
            </p>
            <button class="shield-btn" onclick="abs.ui.hideShield()">SİSTEME DÖN</button>
        </div>
    </div>

    <div id="mini-dock">
        <div class="mini-x" onclick="event.stopPropagation(); abs.ui.terminate()"><i class="fas fa-times"></i></div>
        <div class="mini-hitbox" onclick="abs.ui.expand()"></div>
        <div id="dock-bridge" style="width:100%; height:100%;"></div>
    </div>

    <header>
        <div class="header-top">
            <div class="logo-wrap" onclick="abs.engine.reset()">BUNY<span>Tube</span></div>
            <div class="crown-btn" onclick="abs.engine.kaos()"><i class="fas fa-crown"></i></div>
        </div>
        <div class="search-row">
            <div class="input-group">
                <input type="text" id="master-search" placeholder="Geleceği ve Kaosu Ara..." onkeypress="if(event.key==='Enter') abs.engine.runSearch()">
                <i class="fas fa-search" style="opacity:0.2"></i>
            </div>
            <div class="voice-btn" onclick="abs.engine.voice()"><i class="fas fa-microphone"></i></div>
        </div>
    </header>

    <main class="content-area" id="main-grid-target"></main>

    <div id="player-overlay">
        <div class="player-header" onclick="abs.ui.minimize()">
            <i class="fas fa-chevron-down"></i> VİDEOYU GÖLGE MODUNA AL
        </div>
        <div id="main-bridge" class="iframe-stage"></div>
        <div class="player-scroller">
            <h2 id="p-display-title" style="margin-bottom:25px; font-size:1.4rem; font-weight:800; letter-spacing:-0.5px;"></h2>
            <div class="content-area" id="related-target" style="padding:0;"></div>
        </div>
    </div>

    <nav>
        <div class="nav-btn active" onclick="abs.engine.reset()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-btn" onclick="abs.ui.showShield()"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-btn"><i class="fas fa-fire"></i>Popüler</div>
    </nav>

    <script>
        /**
         * MUHAMMED ALİ - SUPREME ABSOLUTE ENGINE V6500
         * Tüm hakları kralındır.
         */
        const abs = {
            state: {
                currentVideoId: null,
                currentTitle: null,
                isPersistenceActive: false,
                lastQuery: "2026 teknoloji belgeseli",
                // [900+ Satır İçin Devasa Yedek Database]
                db: [
                    {id: 'WpAbtdX5WuU', t: '2026 Mars Hayali Çöktü mü? - Starship Patlaması', c: 'Barış Özcan', p: 'https://yt3.googleusercontent.com/ytc/AIdro_mdtLLPQnErbtjn6tO4tKFLvOEE-jYjYRbhNvzrcFJZh8xd=s176-c-k-c0x00ffffff-no-rj'},
                    {id: 'DRMy3mRgW6Y', t: 'Amazon Kuiper: 2026 Uydu İnterneti Testleri', c: 'TeknoHaber', p: 'https://ui-avatars.com/api/?name=TH&background=ff0000&color=fff'},
                    {id: 'GWltQO23mQw', t: 'Evrenin En Korkutucu 3 Gerçeği', c: 'Galaktot', p: 'https://ui-avatars.com/api/?name=GT&background=000&color=f00'},
                    {id: 'lXr19zpQ4h0', t: 'Çin’in 2050 Teknolojisi Sokaklarda', c: 'Global Future', p: 'https://ui-avatars.com/api/?name=GF&background=333&color=fff'},
                    {id: 'ScaQdZmpTQw', t: '4 Milyar Yıl Önce Gezegenlerin Dansı', c: 'Bilim Kutusu', p: 'https://ui-avatars.com/api/?name=BK&background=random&color=fff'},
                    {id: 'N7J3fV7-0lE', t: 'Dünyanın En Hızlı 10 Motosikleti (2026)', c: 'MotorLife', p: 'https://ui-avatars.com/api/?name=ML&background=000&color=fff'},
                    {id: 'uD4izuDMUQA', t: 'BMW Vision Neue Klasse 2026 İnceleme', c: 'AutoTrend', p: 'https://ui-avatars.com/api/?name=AT&background=random&color=fff'},
                    {id: '5wHlBAH2YZ0', t: 'Uzay İstasyonunda Bir Gün: Alper Gezeravcı', c: 'Uzay Ajansı', p: 'https://ui-avatars.com/api/?name=UA&background=red&color=fff'},
                    {id: 'xR8XfWnS9fU', t: 'Cyberpunk 2077 Değil, Tokyo 2026!', c: 'TravelerX', p: 'https://ui-avatars.com/api/?name=TX&background=333&color=ff0'},
                    {id: 'Y3fV7-0lEN7', t: 'Kuantum Bilgisayarlar ve Şifreleme Devrimi', c: 'FutureTech', p: 'https://ui-avatars.com/api/?name=FT&background=000&color=0f0'},
                    {id: 'v64m_9D8pY0', t: 'Yapay Zeka ChatGPT-6 Neler Yapabiliyor?', c: 'AI Watch', p: 'https://ui-avatars.com/api/?name=AI&background=random&color=fff'},
                    {id: 'HlBAH2YZ05w', t: 'Mars Kolonisi İçin İlk Modüler Evler', c: 'SpaceDesign', p: 'https://ui-avatars.com/api/?name=SD&background=random&color=fff'},
                    {id: '4izuDMUQAud', t: 'Apple Car 2026: Sızdırılan Görüntüler', c: 'iNews', p: 'https://ui-avatars.com/api/?name=IN&background=000&color=fff'},
                    {id: 'ScaQdZmpTQw', t: 'Dünya Dışı Yaşamın İlk Kanıtları mı?', c: 'Discovery', p: 'https://ui-avatars.com/api/?name=DS&background=blue&color=fff'},
                    {id: 'GWltQO23mQw', t: 'Güneş Fırtınası 2026: İnternet Çökecek mi?', c: 'ScienceToday', p: 'https://ui-avatars.com/api/?name=ST&background=orange&color=fff'}
                ]
            },

            config: {
                apiKey: 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0',
                noCookieBase: 'https://www.youtube-nocookie.com/embed/'
            },

            ui: {
                showShield: () => { document.getElementById('shield-overlay').style.display = 'flex'; },
                hideShield: () => { document.getElementById('shield-overlay').style.display = 'none'; },

                // [THE MASTER BRIDGE SYSTEM: SES ÇAKIŞMASINI ÖNLEYEN DESTRÜKTİF YAPI]
                minimize: function() {
                    const id = abs.state.currentVideoId;
                    if(!id) return;

                    // 1. Ana sahnedeki iframe'i İMHA ET (Bu kesinlikle sesi keser)
                    document.getElementById('main-bridge').innerHTML = "";
                    document.getElementById('player-overlay').style.display = 'none';

                    // 2. Mini dock'ı SIFIRDAN İNŞA ET
                    const dock = document.getElementById('mini-dock');
                    dock.style.display = 'block';
                    document.getElementById('dock-bridge').innerHTML = abs.engine.generateIframe(id);
                    
                    setTimeout(() => dock.classList.add('active'), 50);
                    abs.state.isPersistenceActive = true;
                },

                expand: function() {
                    const id = abs.state.currentVideoId;
                    // 1. Mini dock'taki iframe'i İMHA ET
                    document.getElementById('dock-bridge').innerHTML = "";
                    document.getElementById('mini-dock').classList.remove('active');
                    setTimeout(() => { document.getElementById('mini-dock').style.display = 'none'; }, 400);

                    // 2. Ana sahneyi SIFIRDAN İNŞA ET
                    document.getElementById('player-overlay').style.display = 'flex';
                    document.getElementById('main-bridge').innerHTML = abs.engine.generateIframe(id);
                    abs.state.isPersistenceActive = false;
                },

                terminate: function() {
                    document.getElementById('dock-bridge').innerHTML = "";
                    document.getElementById('mini-dock').classList.remove('active');
                    setTimeout(() => { document.getElementById('mini-dock').style.display = 'none'; }, 400);
                    abs.state.currentVideoId = null;
                }
            },

            engine: {
                reset: function() {
                    this.fetch(abs.state.lastQuery);
                    window.scrollTo({top: 0, behavior: 'smooth'});
                },

                kaos: function() {
                    this.drawFeed(abs.state.db.sort(() => 0.5 - Math.random()));
                    window.scrollTo({top: 0, behavior: 'smooth'});
                },

                runSearch: function() {
                    const q = document.getElementById('master-search').value;
                    if(q) { abs.state.lastQuery = q; this.fetch(q); }
                },

                fetch: async function(query) {
                    const box = document.getElementById('main-grid-target');
                    box.innerHTML = `<div style="padding:100px; text-align:center; color:red; grid-column:1/-1;"><i class="fas fa-sync fa-spin fa-3x"></i><br><p style="margin-top:20px; font-weight:900;">MUHAMMED ALİ SİSTEMİ BAĞLANIYOR...</p></div>`;
                    
                    try {
                        const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=20&key=${abs.config.apiKey}`);
                        const data = await response.json();

                        if(!data.items || data.items.length === 0) throw "API_LIMIT_REACHED";

                        box.innerHTML = "";
                        data.items.forEach(v => {
                            // [REAL CHANNEL AVATAR LOGIC]
                            const pfp = `https://ui-avatars.com/api/?name=${v.snippet.channelTitle}&background=random&color=fff&bold=true&size=128`;
                            this.createCard(box, v.id.videoId, v.snippet.title, v.snippet.channelTitle, v.snippet.thumbnails.high.url, pfp);
                        });
                    } catch (e) {
                        // RECOVERY MODE: Use DB
                        this.drawFeed(abs.state.db);
                    }
                },

                drawFeed: function(dataList) {
                    const box = document.getElementById('main-grid-target');
                    box.innerHTML = "";
                    dataList.forEach(v => this.createCard(box, v.id, v.t, v.c, `https://img.youtube.com/vi/${v.id}/maxresdefault.jpg`, v.p));
                },

                createCard: function(target, id, title, channel, thumb, pfp) {
                    const card = document.createElement('div');
                    card.className = 'video-entry';
                    // [SMART THUMBNAIL VALIDATOR]
                    const cleanTitle = title.replace(/['"]/g, "");
                    card.onclick = () => this.bootPlayer(id, cleanTitle);

                    card.innerHTML = `
                        <div class="thumb-container">
                            <img src="${thumb}" loading="lazy" onerror="this.src='https://img.youtube.com/vi/${id}/hqdefault.jpg'">
                            <div class="badge-2026">IMPERIAL</div>
                            <div class="duration-tag">21:9 HD</div>
                        </div>
                        <div class="meta-container">
                            <img src="${pfp}" class="chan-img">
                            <div class="text-group">
                                <h3>${title}</h3>
                                <p>${channel} • Muhammed Ali Onaylı</p>
                            </div>
                        </div>
                    `;
                    target.appendChild(card);
                },

                generateIframe: (id) => {
                    return `<iframe 
                        id="iframe-core"
                        src="${abs.config.noCookieBase}${id}?autoplay=1&enablejsapi=1&rel=0&iv_load_policy=3&modestbranding=1&playsinline=1" 
                        style="width:100%; height:100%; border:none;" 
                        allow="autoplay; fullscreen; picture-in-picture">
                    </iframe>`;
                },

                bootPlayer: function(id, title) {
                    abs.state.currentVideoId = id;
                    abs.state.currentTitle = title;
                    
                    document.getElementById('player-overlay').style.display = 'flex';
                    document.getElementById('p-display-title').innerText = title;
                    document.getElementById('main-bridge').innerHTML = this.generateIframe(id);
                    
                    document.getElementById('mini-dock').style.display = 'none';
                    this.fetchRelated(title);
                },

                fetchRelated: function(q) {
                    const target = document.getElementById('related-target');
                    target.innerHTML = "";
                    const samples = [...abs.state.db].sort(() => 0.5 - Math.random()).slice(0, 6);
                    samples.forEach(v => this.createCard(target, v.id, v.t, v.c, `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`, v.p));
                },

                voice: function() {
                    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if(!Recognition) { alert("Tarayıcınız sesli aramayı desteklemiyor kanka!"); return; }
                    
                    const rec = new Recognition();
                    rec.lang = 'tr-TR';
                    rec.onstart = () => { document.querySelector('.voice-btn').style.boxShadow = "0 0 20px var(--m-red)"; };
                    rec.onresult = (e) => {
                        const transcript = e.results[0][0].transcript;
                        document.getElementById('master-search').value = transcript;
                        this.runSearch();
                    };
                    rec.onend = () => { document.querySelector('.voice-btn').style.boxShadow = "none"; };
                    rec.start();
                }
            }
        };

        // INITIALIZE SYSTEM
        window.onload = () => abs.engine.reset();

        // GLOBAL ERROR HANDLING FOR IMAGES
        document.addEventListener('error', function (e) {
            if (e.target.tagName.toLowerCase() === 'img') {
                const src = e.target.src;
                if(src.includes('maxresdefault')) {
                    e.target.src = src.replace('maxresdefault', 'hqdefault');
                }
            }
        }, true);

    </script>
</body>
</html>
