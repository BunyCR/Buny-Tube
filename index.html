<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNY TUBE ULTIMATE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-banner"></div>
    <div class="glow-bg"></div>

    <div id="announcement-bar">
        <span id="ann-content"></span>
    </div>

    <header>
        <h1 id="display-logo">BunyTube</h1>
        <div class="header-icons">
            <i class="fas fa-heart" onclick="app.showFavorites()"></i>
            <i class="fas fa-crown admin-trigger" onclick="app.openLogin()"></i>
        </div>
    </header>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Kozmik arama yap...">
            <i class="fas fa-microphone" id="voice-btn" onclick="app.startVoiceSearch()"></i>
        </div>
    </div>

    <nav id="category-bar"></nav>

    <main id="main-feed" class="feed"></main>

    <section class="contact-area">
        <div class="contact-card">
            <h3>Bize Mesaj Gönder</h3>
            <input type="text" id="msg-name" placeholder="Adınız">
            <textarea id="msg-body" placeholder="Mesajınız..."></textarea>
            <button onclick="app.sendMsg()">GÖNDER</button>
        </div>
    </section>

    <div id="player">
        <div class="player-nav">
            <i class="fas fa-chevron-down" onclick="app.minimize()"></i>
            <span id="playing-title">Oynatılıyor...</span>
            <i class="fas fa-times" onclick="app.closePlayer()"></i>
        </div>
        <div id="player-box"></div>
        <div id="suggestion-list"></div>
    </div>

    <div id="login-modal" class="modal-overlay">
        <div class="login-box">
            <h2>ADMIN PANELİ</h2>
            <p>YETKİLİ ŞİFRESİ:</p>
            <input type="password" id="admin-pass-input" placeholder="••••">
            <div class="login-btns">
                <button onclick="app.closeLogin()" class="btn-cancel">İptal</button>
                <button onclick="app.checkLogin()" class="btn-confirm">Tamam</button>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="admin-ui">
        <div class="admin-header">
            <h2>SİSTEM KONTROL</h2>
            <i class="fas fa-times" onclick="app.closeAdmin()"></i>
        </div>
        
        <div class="admin-stats">
            <div class="stat-item"><i class="fas fa-eye"></i> <span id="stat-views">0</span><p>İZLENME</p></div>
            <div class="stat-item"><i class="fas fa-envelope"></i> <span id="stat-coms">0</span><p>MESAJ</p></div>
        </div>

        <div class="admin-scroll">
            <div class="admin-card">
                <h3>GENEL AYARLAR</h3>
                <input type="text" id="edit-logo" placeholder="Logo İsmi">
                <input type="password" id="edit-pass" placeholder="Yeni Panel Şifresi">
                <input type="color" id="edit-color">
            </div>

            <div class="admin-card">
                <h3>DUYURU YÖNETİMİ</h3>
                <input type="text" id="edit-ann-msg" placeholder="Duyuru Metni">
                <input type="text" id="edit-ann-link" placeholder="Duyuru Linki (İndirme)">
                <label class="switch-lab"><input type="checkbox" id="edit-ann-status"> Duyuru Aktif</label>
            </div>

            <div class="admin-card">
                <h3>GELEN MESAJLAR</h3>
                <div id="admin-comments-list"></div>
            </div>
        </div>
        <button class="save-master" onclick="app.saveSettings()">AYARLARI KAYDET</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
