<div id="player" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:200000; overflow-y:auto;">
    
    <div class="player-controls" style="display:flex; justify-content:space-between; padding:15px; background:#0a0a0a;">
        <i class="fas fa-chevron-down" onclick="app.minimize()" style="font-size:1.5rem; color:white; cursor:pointer;"></i>
        <span style="font-size:0.8rem; color:gray;">BUNY PLAYER</span>
        <i class="fas fa-times" onclick="app.closePlayer()" style="font-size:1.5rem; color:red; cursor:pointer;"></i>
    </div>

    <div id="player-box" style="width:100%; aspect-ratio:16/9; background:#000; position:sticky; top:0; z-index:10;"></div>

    <div id="suggestion-list"></div>
</div>
