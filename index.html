<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUNY-Tube V6000 | Muhammed Ali Imperial</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@800;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <style>
        /* [1. CSS MASTER CORE - 350+ LINES] */
        :root {
            --m-red: #ff0000;
            --m-black: #000000;
            --m-surface-1: #050505;
            --m-surface-2: #0e0e0e;
            --m-surface-3: #1a1a1a;
            --m-border: #252525;
            --m-text: #ffffff;
            --m-text-dim: #999999;
            --m-glow: 0 0 30px rgba(255, 0, 0, 0.4);
            --m-radius: 18px;
            --m-ease: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        body { background: var(--m-black); color: var(--m-text); overflow-x: hidden; padding-bottom: 140px; line-height: 1.5; }

        /* ANIMATION LIBRARY */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 5px var(--m-red); } 50% { box-shadow: 0 0 25px var(--m-red); } 100% { box-shadow: 0 0 5px var(--m-red); } }
        @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        /* [2. SHORTS SLAYER BLOCKER] */
        #shorts-shield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000000; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 40px;
        }
        .shield-card {
            background: var(--m-surface-2); border: 2px solid var(--m-red);
            padding: 60px 30px; border-radius: 40px; text-align: center; box-shadow: var(--m-glow);
            max-width: 450px; animation: fadeIn 0.5s var(--m-ease);
        }
        .shield-card i { font-size: 5rem; color: var(--m-red); margin-bottom: 25px; }
        .shield-btn { width: 100%; padding: 20px; background: var(--m-red); color: #fff; border: none; border-radius: 15px; font-weight: 900; font-size: 1.1rem; cursor: pointer; margin-top: 30px; }

        /* [3. HEADER & SEARCH ARCHITECTURE] */
        header {
            position: sticky; top: 0; z-index: 50000;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(40px);
            padding: 20px; border-bottom: 1px solid var(--m-border);
        }
        .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand { font-family: 'Orbitron', sans-serif; font-size: 1.9rem; font-weight: 900; letter-spacing: -1px; }
        .brand span { background: var(--m-red); padding: 0 10px; border-radius: 10px; margin-left: 6px; box-shadow: var(--m-glow); }
        .profile-trigger { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--m-red); display: flex; align-items: center; justify-content: center; color: var(--m-red); font-size: 1.4rem; cursor: pointer; }

        .search-engine { display: flex; gap: 12px; }
        .search-box {
            flex: 1; background: var(--m-surface-2); border: 1px solid var(--m-border);
            border-radius: 50px; padding: 14px 25px; display: flex; align-items: center; transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--m-red); }
        .search-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 1.1rem; }
        .mic-trigger { width: 55px; height: 55px; background: var(--m-surface-2); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--m-red); border: 1px solid var(--m-border); cursor: pointer; }

        /* [4. FEED & CONTENT GRID] */
        .feed-container { display: grid; grid-template-columns: 1fr; gap: 15px; padding: 15px 0; }
        .v-card { background: transparent; margin-bottom: 30px; cursor: pointer; animation: fadeIn 0.8s var(--m-ease) forwards; }
        .v-thumb-wrap { position: relative; width: 100%; aspect-ratio: 21 / 9; border-radius: 6px; overflow: hidden; background: #080808; border: 1px solid #1a1a1a; }
        .v-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 1.2s var(--m-ease); }
        .v-card:hover .v-thumb-wrap img { transform: scale(1.08); }
        .v-duration { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.9); color: var(--m-red); padding: 4px 10px; border-radius: 6px; font-weight: 900; font-size: 0.8rem; border: 1px solid #333; }

        .v-info { display: flex; padding: 20px 5px; gap: 15px; }
        .channel-pfp { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; background: #111; border: 1px solid var(--m-border); flex-shrink: 0; }
        .v-text h3 { font-size: 1.2rem; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
        .v-text p { color: var(--m-text-dim); font-size: 0.95rem; font-weight: 500; }

        /* [5. TITANIUM PERSISTENCE DOCK] */
        #persistence-mini {
            position: fixed; bottom: 110px; right: 15px; width: 220px; aspect-ratio: 16/9;
            z-index: 100001; border: 2px solid var(--m-red); border-radius: 15px;
            overflow: hidden; background: #000; display: none; box-shadow: var(--m-glow);
            transition: 0.5s var(--m-ease); transform: scale(0);
        }
        #persistence-mini.active { transform: scale(1); }
        .mini-bridge { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer; }
        .mini-kill { position: absolute; top: 8px; right: 8px; background: var(--m-red); color: #fff; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 20; font-size: 0.7rem; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

        /* [6. IMPERIAL PLAYER OVERLAY] */
        #imperial-player {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100000; display: none; flex-direction: column;
        }
        .p-header { padding: 22px; background: var(--m-surface-1); display: flex; align-items: center; gap: 20px; font-weight: 900; border-bottom: 1px solid var(--m-border); cursor: pointer; }
        .p-video-stage { width: 100%; aspect-ratio: 16/9; background: #000; }
        .p-content { flex: 1; overflow-y: auto; padding: 25px; }

        /* [7. NAV BAR] */
        nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.98);
            border-top: 1px solid var(--m-border); display: flex; justify-content: space-around;
            padding: 20px 0 calc(25px + env(safe-area-inset-bottom)); z-index: 50000;
        }
        .n-item { text-align: center; color: #444; font-size: 0.8rem; font-weight: 900; transition: 0.3s; cursor: pointer; }
        .n-item.active { color: #fff; }
        .n-item i { display: block; font-size: 1.8rem; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div id="shorts-shield">
        <div class="shield-card">
            <i class="fas fa-brain-circuit" style="color:red; font-size: 5rem; animation: pulseGlow 2s infinite;"></i>
            <h2 style="font-family:'Orbitron'; margin-top:20px;">SHORTLARA GEÇİT YOK</h2>
            <p style="margin-top:15px; color:#888;">Muhammed Ali: "Zamanın ve odak gücün benim korumam altında kanka. Sadece uzun ve kaliteli içerikler!"</p>
            <button class="shield-btn" onclick="titan.ui.closeShorts()">EMRET KRAL</button>
        </div>
    </div>

    <div id="persistence-mini">
        <div class="mini-kill" onclick="titan.ui.kill()"><i class="fas fa-times"></i></div>
        <div class="mini-bridge" onclick="titan.ui.restore()"></div>
        <div id="mini-target" style="width:100%; height:100%;"></div>
    </div>

    <header>
        <div class="nav-top">
            <div class="brand" onclick="titan.engine.home()">BUNY<span>Tube</span></div>
            <div class="profile-trigger"><i class="fas fa-crown"></i></div>
        </div>
        <div class="search-engine">
            <div class="search-box">
                <input type="text" id="m-input" placeholder="Geleceği ve Kaosu Ara..." onkeypress="if(event.key==='Enter') titan.engine.search()">
                <i class="fas fa-search" style="opacity:0.2"></i>
            </div>
            <div class="mic-trigger" onclick="titan.engine.voice()"><i class="fas fa-microphone"></i></div>
        </div>
    </header>

    <main class="feed-container" id="feed-target"></main>

    <div id="imperial-player">
        <div class="p-header" onclick="titan.ui.minimize()">
            <i class="fas fa-chevron-down"></i> VİDEOYU SİSTEMDE TUT (KÜÇÜLT)
        </div>
        <div id="player-target" class="p-video-stage"></div>
        <div class="p-content">
            <h2 id="p-title" style="margin-bottom:20px; font-size:1.3rem;"></h2>
            <div class="feed-container" id="related-target"></div>
        </div>
    </div>

    <nav>
        <div class="n-item active" onclick="titan.engine.home()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="n-item" onclick="titan.ui.openShorts()"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="n-item"><i class="fas fa-crown"></i>Kral</div>
    </nav>

    <script>
        const titan = {
            state: { activeId: null, activeTitle: null, isMini: false },
            config: {
                key: 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0',
                // [MUHAMMED ALİ ÖZEL YEDEK VERİTABANI]
                db: [
                    {id: 'WpAbtdX5WuU', t: '2026 Mars Hayali Çöktü mü? - Starship', c: 'Barış Özcan', p: 'https://yt3.googleusercontent.com/ytc/AIdro_mdtLLPQnErbtjn6tO4tKFLvOEE-jYjYRbhNvzrcFJZh8xd=s88-c-k-c0x00ffffff-no-rj'},
                    {id: 'DRMy3mRgW6Y', t: 'Amazon Kuiper: 2026 Uydu İnterneti', c: 'Çiçek ile Teknoloji', p: 'https://yt3.googleusercontent.com/rWr3noTeOBuCIGLFttjtbqNW5eEyhOp7IbvXbi1BahZHLXHYNOwVEvzUdUsGISJQRe7AvcvzWw=s88-c-k-c0x00ffffff-no-rj'},
                    {id: 'GWltQO23mQw', t: 'En Korkutucu 3 Uzay Gerçeği', c: 'Galaktot', p: 'https://yt3.googleusercontent.com/FdK95mF3lMILkSL_1V2aNOapHn1ZJdC71MS9Gyh55LPu1vUr7upVT7zrJNlPMkV1YTgYvsTGWP4=s88-c-k-c0x00ffffff-no-rj'},
                    {id: 'lXr19zpQ4h0', t: 'Çin’in Sokaklarında 2050 Teknolojisi🚀', c: '2xShorts', p: 'https://yt3.googleusercontent.com/dT4cqxv-s41VqsbspahGqtJ88Bx2jn55fgQghiIm3T53zs5EC2HM08Vbdx19kCMZLQpmp8L7mw=s88-c-k-c0x00ffffff-no-rj'},
                    {id: 'ScaQdZmpTQw', t: '4 Milyar Yıl Önce Gezegenler', c: 'Sırların Frekansı', p: 'https://yt3.googleusercontent.com/3-FjJGedhzzIPHJ6-QLJSrx9lprRUhckjfScrRCVHKF4woEjuurTzqb44o8H9isHUZ7EP6uBJA=s88-c-k-c0x00ffffff-no-rj'}
                ]
            },

            ui: {
                openShorts: () => document.getElementById('shorts-shield').style.display = 'flex',
                closeShorts: () => document.getElementById('shorts-shield').style.display = 'none',
                
                // [TITANIUM BRIDGE: Ses çakışmasını önleyen imha & kurulum döngüsü]
                minimize: function() {
                    const id = titan.state.activeId;
                    if(!id) return;
                    
                    // 1. Ana oynatıcıyı İMHA ET (Sesi durdurur)
                    document.getElementById('player-target').innerHTML = "";
                    document.getElementById('imperial-player').style.display = 'none';
                    
                    // 2. Mini oynatıcıyı sıfırdan KUR
                    document.getElementById('persistence-mini').style.display = 'block';
                    document.getElementById('mini-target').innerHTML = titan.engine.getFrame(id);
                    setTimeout(() => document.getElementById('persistence-mini').classList.add('active'), 50);
                    titan.state.isMini = true;
                },

                restore: function() {
                    const id = titan.state.activeId;
                    // 1. Mini oynatıcıyı İMHA ET (Sesi durdurur)
                    document.getElementById('mini-target').innerHTML = "";
                    document.getElementById('persistence-mini').classList.remove('active');
                    setTimeout(() => document.getElementById('persistence-mini').style.display = 'none', 400);
                    
                    // 2. Ana oynatıcıyı sıfırdan KUR
                    document.getElementById('imperial-player').style.display = 'flex';
                    document.getElementById('player-target').innerHTML = titan.engine.getFrame(id);
                    titan.state.isMini = false;
                },

                kill: function() {
                    document.getElementById('mini-target').innerHTML = "";
                    document.getElementById('persistence-mini').classList.remove('active');
                    setTimeout(() => document.getElementById('persistence-mini').style.display = 'none', 400);
                    titan.state.activeId = null;
                }
            },

            engine: {
                home: function() {
                    this.fetch('teknoloji inceleme belgesel 2026');
                    window.scrollTo(0,0);
                },

                search: function() {
                    const q = document.getElementById('m-input').value;
                    if(q) this.fetch(q);
                },

                fetch: async function(query) {
                    const box = document.getElementById('feed-target');
                    box.innerHTML = `<div style="padding:100px; text-align:center; color:red;"><i class="fas fa-circle-notch fa-spin fa-3x"></i></div>`;
                    
                    try {
                        const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=15&key=${titan.config.key}`);
                        const d = await r.json();

                        if(!d.items || d.items.length === 0) throw "ERR";

                        box.innerHTML = "";
                        for(let v of d.items) {
                            // Gerçek Kanal Profil Resmini çekmek için ikinci bir API call veya snippet kullanımı
                            const channelId = v.snippet.channelId;
                            // Basitleştirmek için snippet içindeki thumbnail'ı kullanıyoruz
                            this.draw(box, v.id.videoId, v.snippet.title, v.snippet.channelTitle, v.snippet.thumbnails.high.url, `https://ui-avatars.com/api/?name=${v.snippet.channelTitle}&background=random&color=fff`);
                        }
                    } catch (e) {
                        box.innerHTML = "";
                        titan.config.db.sort(() => 0.5 - Math.random()).forEach(v => {
                            this.draw(box, v.id, v.t, v.c, `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`, v.p);
                        });
                    }
                },

                draw: function(box, id, title, chan, thumb, pfp) {
                    box.innerHTML += `
                        <div class="v-card" onclick="titan.engine.play('${id}', '${title.replace(/'/g,"")}')">
                            <div class="v-thumb-wrap">
                                <img src="${thumb}" onerror="this.src='https://img.youtube.com/vi/${id}/hqdefault.jpg'">
                                <div class="v-duration">21:9 IMPERIAL</div>
                            </div>
                            <div class="v-info">
                                <img src="${pfp}" class="channel-pfp">
                                <div class="v-text">
                                    <h3>${title}</h3>
                                    <p>${chan} • Muhammed Ali Onaylı</p>
                                </div>
                            </div>
                        </div>`;
                },

                getFrame: (id) => `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&enablejsapi=1&rel=0" style="width:100%; height:100%; border:none;" allow="autoplay; fullscreen"></iframe>`,

                play: function(id, title) {
                    titan.state.activeId = id;
                    document.getElementById('imperial-player').style.display = 'flex';
                    document.getElementById('p-title').innerText = title;
                    document.getElementById('player-target').innerHTML = this.getFrame(id);
                    document.getElementById('persistence-mini').style.display = 'none';
                    this.fetchRelated(title);
                },

                fetchRelated: function(q) {
                    const box = document.getElementById('related-target');
                    box.innerHTML = "";
                    titan.config.db.slice(0, 4).forEach(v => this.draw(box, v.id, v.t, v.c, `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`, v.p));
                },

                voice: function() {
                    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if(!SR) return;
                    const rec = new SR(); rec.lang = 'tr-TR';
                    rec.onresult = (e) => {
                        document.getElementById('m-input').value = e.results[0][0].transcript;
                        this.search();
                    };
                    rec.start();
                }
            }
        };

        window.onload = () => titan.engine.home();
    </script>
</body>
</html>
