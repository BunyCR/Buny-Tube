<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BunyTube</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0d0d0d;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* HEADER */
header{
  height:60px;
  background:#111;
  display:flex;
  align-items:center;
  padding:0 10px;
  border-bottom:1px solid #222;
}
.logo{
  color:#ff2b2b;
  font-size:22px;
  font-weight:bold;
}
.search{
  flex:1;
  margin-left:10px;
}
.search input{
  width:100%;
  padding:8px;
  background:#000;
  border:1px solid #333;
  color:white;
}

/* SAYFALAR */
.page{
  height:calc(100vh - 120px);
  overflow:auto;
  padding:12px;
}
.video-card{
  background:#111;
  padding:15px;
  margin-bottom:10px;
  border-radius:8px;
}

/* SHORTS */
#shorts{
  padding:0;
  overflow:hidden;
}
.shorts-container{
  height:100%;
  position:relative;
}
.short{
  height:100%;
  width:100%;
  position:absolute;
  top:0;
  left:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  transition:transform 0.3s ease;
}

/* ALT MENÜ */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:60px;
  background:#111;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #222;
}
.bottom-nav button{
  background:none;
  border:none;
  color:white;
  font-size:12px;
}

/* BAKIM */
#maintenance{
  display:none;
  height:100vh;
  background:#0d0d0d;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<!-- BAKIM EKRANI -->
<div id="maintenance">
  <h1>BunyTube Bakımda</h1>
  <p id="maintenanceText"></p>
</div>

<header>
  <div class="logo">BunyTube</div>
  <div class="search">
    <input placeholder="Video ara">
  </div>
</header>

<!-- ANA SAYFA -->
<div id="home" class="page">
  <h3>Trendler</h3>
  <div class="video-card">Video 1</div>
  <div class="video-card">Video 2</div>
  <div class="video-card">Video 3</div>
</div>

<!-- SHORTS -->
<div id="shorts" class="page" style="display:none">
  <div class="shorts-container" id="shortsContainer">
    <div class="short" style="background:#111">Short 1</div>
    <div class="short" style="background:#222">Short 2</div>
    <div class="short" style="background:#333">Short 3</div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin" class="page" style="display:none">
  <h3>Admin Panel</h3>
  <input placeholder="Video başlığı"><br><br>
  <input placeholder="Video linki"><br><br>
  <button>Yükle</button>
</div>

<!-- ALT MENÜ -->
<div class="bottom-nav">
  <button onclick="showPage('home')">🏠<br>Ana</button>
  <button onclick="showPage('shorts')">▶️<br>Shorts</button>
  <button onclick="openAdmin()">⚙️<br>Admin</button>
</div>

<script>
/* CONFIG.JSON OKUMA */
fetch("config.json")
.then(r=>r.json())
.then(cfg=>{
  if(cfg.maintenance){
    document.getElementById("maintenanceText").innerText = cfg.maintenanceText;
    document.body.innerHTML = document.getElementById("maintenance").outerHTML;
  }
});

/* SAYFA GEÇİŞ */
function showPage(id){
  home.style.display="none";
  shorts.style.display="none";
  admin.style.display="none";
  document.getElementById(id).style.display="block";
}

/* ADMIN */
function openAdmin(){
  let p = prompt("Admin şifresi");
  if(p==="1234") showPage("admin");
  else alert("Yetkisiz");
}

/* SHORTS KAYDIRMA */
let current = 0;
const shortEls = document.querySelectorAll(".short");
let startY = 0;

function updateShorts(){
  shortEls.forEach((s,i)=>{
    s.style.transform = `translateY(${(i-current)*100}%)`;
  });
}
updateShorts();

const container = document.getElementById("shortsContainer");
container.addEventListener("touchstart",e=>{
  startY = e.touches[0].clientY;
});
container.addEventListener("touchend",e=>{
  let endY = e.changedTouches[0].clientY;
  if(startY - endY > 50 && current < shortEls.length-1) current++;
  if(endY - startY > 50 && current > 0) current--;
  updateShorts();
});
</script>

</body>
</html>
