<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUNY-Tube V700 | King Edition</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@800&family=Syncopate:wght@700&display=swap" rel="stylesheet">

    <style>
        /* [SECTION 1: ADVANCED CSS VARIABLES] */
        :root {
            --m-red: #ff0000;
            --m-dark-red: #990000;
            --m-black: #000000;
            --m-soft-black: #080808;
            --m-gray: #121212;
            --m-border: #1f1f1f;
            --m-text: #ffffff;
            --m-sub-text: #999999;
            --m-glow: 0 0 25px rgba(255, 0, 0, 0.4);
            --m-trans: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* [SECTION 2: GLOBAL RESET & SCROLLBAR] */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            scrollbar-width: none;
        }

        *::-webkit-scrollbar { display: none; }

        body {
            background-color: var(--m-black);
            color: var(--m-text);
            overflow-x: hidden;
            padding-bottom: 100px;
        }

        /* [SECTION 3: PREMIUM ANIMATIONS] */
        @keyframes crown_pulse {
            0% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 5px var(--m-red)); }
            50% { transform: scale(1.1) rotate(5deg); filter: drop-shadow(0 0 20px var(--m-red)); }
            100% { transform: scale(1) rotate(-5deg); filter: drop-shadow(0 0 5px var(--m-red)); }
        }

        @keyframes feed_entry {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* [SECTION 4: COMPACT HEADER SYSTEM] */
        .v7-header {
            position: sticky;
            top: 0;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(25px);
            padding: 14px 18px;
            border-bottom: 1px solid var(--m-border);
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: var(--m-text);
            text-decoration: none;
            letter-spacing: -1px;
        }

        .header-brand span {
            background: var(--m-red);
            padding: 1px 7px;
            border-radius: 5px;
            margin-left: 4px;
            box-shadow: var(--m-glow);
        }

        .header-actions {
            display: flex;
            gap: 20px;
            font-size: 1.3rem;
            color: var(--m-red);
        }

        /* [SECTION 5: SEARCH UI ENGINE] */
        .search-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-bar-v7 {
            flex: 1;
            background: var(--m-soft-black);
            border: 1px solid var(--m-border);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            transition: var(--m-trans);
        }

        .search-bar-v7:focus-within {
            border-color: var(--m-red);
            background: #111;
        }

        .search-bar-v7 input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .v7-mic-btn {
            width: 42px;
            height: 42px;
            background: var(--m-soft-black);
            border: 1px solid var(--m-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--m-red);
            cursor: pointer;
            transition: 0.3s;
        }

        .v7-mic-btn.active_rec {
            background: var(--m-red);
            color: white;
            box-shadow: 0 0 20px var(--m-red);
        }

        /* [SECTION 6: ULTRA-WIDE VIDEO GRID] */
        .v7-feed-grid {
            padding: 10px 0;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .v7-card {
            width: 100%;
            background: var(--m-black);
            animation: feed_entry 0.7s ease-out forwards;
        }

        .v7-thumbnail-box {
            position: relative;
            width: 100%;
            aspect-ratio: 21 / 9; /* Geniş ve Basık Sinematik */
            background: #0a0a0a;
            overflow: hidden;
            border-top: 1px solid var(--m-border);
            border-bottom: 1px solid var(--m-border);
        }

        .v7-thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s;
        }

        .v7-duration {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 800;
        }

        .v7-info-area {
            display: flex;
            padding: 16px;
            gap: 16px;
        }

        .v7-avatar {
            width: 44px;
            height: 44px;
            background: var(--m-soft-black);
            border: 1px solid var(--m-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--m-red);
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .v7-text-content h3 {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .v7-meta {
            font-size: 0.8rem;
            color: var(--m-sub-text);
            font-weight: 500;
        }

        /* [SECTION 7: KING'S PROFILE DRAWER] */
        #v7-profile-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 88%;
            height: 100%;
            background: var(--m-soft-black);
            z-index: 50000;
            transition: 0.7s cubic-bezier(0.86, 0, 0.07, 1);
            padding: 80px 30px;
            border-left: 3px solid var(--m-red);
        }

        #v7-profile-drawer.open { right: 0; }

        .king-identity-card {
            text-align: center;
        }

        .king-crown {
            font-size: 3.5rem;
            color: var(--m-red);
            margin-bottom: -15px;
            position: relative;
            z-index: 5;
            animation: crown_pulse 2.5s infinite;
        }

        .king-pfp {
            width: 120px;
            height: 120px;
            background: #111;
            border-radius: 50%;
            margin: 0 auto;
            border: 4px solid var(--m-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: var(--m-red);
        }

        .king-name {
            margin-top: 25px;
            font-family: 'Syncopate', sans-serif;
            font-size: 1.6rem;
            text-transform: uppercase;
        }

        .king-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 20px;
            background: var(--m-red);
            border-radius: 25px;
            font-size: 0.65rem;
            font-weight: 900;
            letter-spacing: 3px;
            box-shadow: var(--m-glow);
        }

        /* [SECTION 8: BOTTOM NAV DOCK] */
        .v7-nav-dock {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.98);
            border-top: 1px solid var(--m-border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 calc(18px + env(safe-area-inset-bottom));
            z-index: 10000;
        }

        .v7-nav-item {
            text-align: center;
            color: var(--m-sub-text);
            font-size: 0.65rem;
            text-decoration: none;
            font-weight: 700;
        }

        .v7-nav-item.active { color: white; }
        .v7-nav-item i { display: block; font-size: 1.6rem; margin-bottom: 6px; }

        /* [SECTION 9: GOD PLAYER SYSTEM] */
        #v7-god-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100000;
            display: none;
            flex-direction: column;
        }

        .god-player-header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: #050505;
            font-weight: 900;
            font-size: 0.8rem;
            color: var(--m-sub-text);
        }
    </style>
</head>
<body>

    <header class="v7-header">
        <div class="header-top-row">
            <a href="#" class="header-brand" onclick="v7.refresh()">BUNY<span>Tube</span></a>
            <div class="header-actions">
                <i class="fas fa-search-plus" onclick="v7.refresh()"></i>
                <i class="fas fa-crown" onclick="v7.toggleProfile()"></i>
            </div>
        </div>
        <div class="search-container">
            <div class="search-bar-v7">
                <input type="text" id="v7-input" placeholder="Kaosu Başlat..." onkeypress="if(event.key==='Enter') v7.runSearch()">
                <i class="fas fa-search" style="opacity:0.2" onclick="v7.runSearch()"></i>
            </div>
            <div class="v7-mic-btn" id="v7-mic" onclick="v7.voiceEngine()">
                <i class="fas fa-microphone"></i>
            </div>
        </div>
    </header>

    <main class="v7-feed-grid" id="v7-feed-target"></main>

    <div id="v7-profile-drawer">
        <i class="fas fa-chevron-right" onclick="v7.toggleProfile()" style="font-size: 1.5rem; color: #333;"></i>
        <div class="king-identity-card">
            <i class="fas fa-crown king-crown"></i>
            <div class="king-pfp"><i class="fas fa-user-shield"></i></div>
            <h2 class="king-name">Muhammed Ali</h2>
            <div class="king-badge">PREMIUM KING DEVELOPER</div>
            
            <div style="margin-top:40px; text-align:left; background:#111; padding:25px; border-radius:20px; border:1px solid #222;">
                <p style="color:#666; font-size:0.85rem; line-height:1.7;">
                    <b>SİSTEM RAPORU V700:</b><br>
                    - Video Oranı: 21:9 Ultra-Wide<br>
                    - Çekirdek: Muhammed Ali God-Logic<br>
                    - Status: Reklamsız & Sınırsız<br>
                    - Kod Mimarisi: 1000+ Satır Standartları
                </p>
            </div>
            <button style="width:100%; margin-top:30px; padding:20px; border-radius:15px; border:none; background:white; color:black; font-weight:900; font-size:1.1rem;" onclick="v7.refresh()">SİSTEMİ YENİLE</button>
        </div>
    </div>

    <div id="v7-god-player">
        <div class="god-player-header" onclick="v7.terminatePlayer()">
            <i class="fas fa-chevron-down"></i> SİSTEM OYNATIYOR
        </div>
        <div id="v7-video-canvas" style="width:100%; aspect-ratio:16/9; background:#000;"></div>
        <div style="flex:1; overflow-y:auto; padding:25px;">
            <h2 id="v7-player-title" style="font-size:1.3rem; margin-bottom:20px; font-weight:700;"></h2>
            <div style="height:1px; background:#1a1a1a; margin-bottom:25px;"></div>
            <p style="color:var(--m-red); font-weight:900; font-size:0.75rem; letter-spacing:2px; margin-bottom:20px;">ÖNERİLEN KAOSLAR</p>
            <div id="v7-player-suggest" class="v7-feed-grid"></div>
        </div>
    </div>

    <nav class="v7-nav-dock">
        <a href="#" class="v7-nav-item active" onclick="v7.refresh()"><i class="fas fa-house-chimney"></i>Ana Sayfa</a>
        <a href="#" class="v7-nav-item" onclick="v7.lockGate()"><i class="fas fa-bolt-lightning"></i>Shorts</a>
        <a href="#" class="v7-nav-item" onclick="v7.lockGate()"><i class="fas fa-boxes-stacked"></i>Kitaplık</a>
    </nav>

    <script>
        /**
         * BUNY-TUBE V700 CORE ENGINE
         * High-Level Data Management & UI Controller
         */
        const v7 = {
            API_KEY: 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0',
            CHAOS_MODES: ['belgesel 2026', 'teknoloji devrimi', 'uzay yolculuğu', 'motosiklet inceleme', 'cyberpunk asmr', 'gelecek vizyonu'],
            
            init: function() {
                console.log("God Architect Engine: Initializing System...");
                this.refresh();
                this.attachListeners();
            },

            formatStats: function(n) {
                if(!n) return "0";
                if(n >= 1000000) return (n/1000000).toFixed(1) + ' Mn';
                if(n >= 1000) return (n/1000).toFixed(0) + ' B';
                return n;
            },

            fetchData: async function(q, target) {
                const searchUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&maxResults=15&key=${this.API_KEY}`;
                
                try {
                    const res = await fetch(searchUrl);
                    const data = await res.json();
                    const container = document.getElementById(target);
                    container.innerHTML = "";

                    if(data.items) {
                        const ids = data.items.map(i => i.id.videoId).join(',');
                        const sRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${ids}&key=${this.API_KEY}`);
                        const sData = await sRes.json();

                        data.items.forEach((item, i) => {
                            const vid = item.id.videoId;
                            if(!vid) return;
                            const vCount = sData.items[i] ? this.formatStats(sData.items[i].statistics.viewCount) : "Premium";
                            const vDate = new Date(item.snippet.publishedAt).toLocaleDateString('tr-TR');

                            container.innerHTML += `
                                <div class="v7-card" onclick="v7.launchPlayer('${vid}', '${item.snippet.title.replace(/'/g, "")}')">
                                    <div class="v7-thumbnail-box">
                                        <img src="${item.snippet.thumbnails.high.url}" loading="lazy">
                                        <div class="v7-duration">21:9 ULTRA</div>
                                    </div>
                                    <div class="v7-info-area">
                                        <div class="v7-avatar"><i class="fas fa-crown"></i></div>
                                        <div class="v7-text-content">
                                            <h3>${item.snippet.title}</h3>
                                            <div class="v7-meta">${item.snippet.channelTitle} • ${vCount} izlenme • ${vDate}</div>
                                        </div>
                                    </div>
                                </div>`;
                        });
                    }
                } catch (err) {
                    console.error("ENGINE_FATAL_ERROR:", err);
                }
            },

            launchPlayer: function(id, title) {
                const p = document.getElementById('v7-god-player');
                p.style.display = 'flex';
                document.getElementById('v7-player-title').innerText = title;
                document.getElementById('v7-video-canvas').innerHTML = `
                    <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1" style="width:100%; height:100%; border:none;" allow="autoplay" allowfullscreen></iframe>`;
                this.fetchData(title, 'v7-player-suggest');
                history.pushState({player:1}, "");
            },

            terminatePlayer: function() {
                document.getElementById('v7-god-player').style.display = 'none';
                document.getElementById('v7-video-canvas').innerHTML = "";
            },

            runSearch: function() {
                const val = document.getElementById('v7-input').value;
                if(val) this.fetchData(val, 'v7-feed-target');
            },

            voiceEngine: function() {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if(!SR) return;
                const rec = new SR();
                rec.lang = 'tr-TR';
                rec.onstart = () => document.getElementById('v7-mic').classList.add('active_rec');
                rec.onend = () => document.getElementById('v7-mic').classList.remove('active_rec');
                rec.onresult = (e) => {
                    document.getElementById('v7-input').value = e.results[0][0].transcript;
                    this.runSearch();
                };
                rec.start();
            },

            toggleProfile: function() { 
                document.getElementById('v7-profile-drawer').classList.toggle('open'); 
            },

            refresh: function() { 
                this.fetchData(this.CHAOS_MODES[Math.floor(Math.random()*this.CHAOS_MODES.length)], 'v7-feed-target'); 
                document.getElementById('v7-profile-drawer').classList.remove('open');
                window.scrollTo(0,0);
            },

            lockGate: function() { 
                alert("MUHAMMED ALİ: Zihin sağlığın için bu bölge mühürlendi!"); 
            },

            attachListeners: function() {
                window.onpopstate = () => { if(document.getElementById('v7-god-player').style.display === 'flex') this.terminatePlayer(); };
                
                // Arka planda oynatma motoru (Mobile Background Play Fix)
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        const frame = document.querySelector('iframe');
                        if(frame) frame.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                    }
                });
            }
        };

        // LAUNCHING SYSTEM
        window.onload = () => v7.init();
    </script>
</body>
</html>
