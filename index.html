<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNY TUBE PREMIUM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff0000; --dark: #0f0f0f; --card: #1e1e1e; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; }
        body { background: var(--dark); color: white; padding-bottom: 70px; }

        /* Kilit Ekranı (Troll Modu) */
        #access-denied-screen { position: fixed; inset: 0; background: #000; z-index: 999999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .brain-content img { width: 250px; filter: hue-rotate(280deg); }
        .brain-content h2 { color: var(--red); margin: 20px 0; font-size: 2rem; letter-spacing: 5px; }

        /* Üst Header */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--dark); z-index: 1000; }
        header h1 { color: white; font-weight: 900; letter-spacing: -1.5px; font-size: 1.5rem; }
        header h1 span { color: var(--red); }
        .header-icons i { margin-left: 20px; cursor: pointer; font-size: 1.2rem; }

        /* Arama Alanı */
        .search-section { padding: 5px 15px; }
        .search-box { background: #222; border: none; padding: 10px 15px; border-radius: 20px; display: flex; align-items: center; }
        .search-box input { background: none; border: none; color: white; flex: 1; outline: none; font-size: 14px; }

        /* Kategori Barı */
        #category-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px; scrollbar-width: none; }
        #category-bar button { background: #2a2a2a; border: none; color: white; padding: 6px 12px; border-radius: 8px; white-space: nowrap; font-size: 13px; font-weight: 500; cursor: pointer; }

        /* Video Listesi */
        .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; padding: 10px; }
        .v-card { background: transparent; overflow: hidden; cursor: pointer; margin-bottom: 10px; }
        .v-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; }
        .v-info { padding: 10px 5px; display: flex; gap: 10px; }
        .v-text { flex: 1; }
        .v-text p { font-size: 0.95rem; font-weight: 600; line-height: 1.3; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-text small { color: #aaa; font-size: 0.8rem; margin-top: 4px; display: block; }

        /* ALT MENÜ (YOUTUBE STİLİ) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #0f0f0f; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2000; }
        .nav-item { text-align: center; color: white; text-decoration: none; cursor: pointer; font-size: 10px; transition: 0.2s; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }
        .nav-item:active { transform: scale(0.9); }

        /* Oynatıcı */
        #player { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; overflow-y: auto; }
        .player-nav { display: flex; justify-content: space-between; padding: 15px; background: #000; align-items: center; }
        #player-box { width: 100%; aspect-ratio: 16/9; }
        #suggestion-list { padding: 15px; }
        .suggest-item { display: flex; gap: 10px; margin-bottom: 15px; }
        .suggest-item img { width: 140px; border-radius: 8px; aspect-ratio: 16/9; object-fit: cover; }
    </style>
</head>
<body>

    <div id="access-denied-screen">
        <div class="brain-content">
            <img src="https://i.pinimg.com/originals/f3/7b/d2/f37bd29f6358e72c86b72d25091c68f1.gif">
            <h2>ERİŞİM ENGELLENDİ</h2>
            <p>Ana Sayfaya dönmek için Logoya tıkla!</p>
        </div>
    </div>

    <header>
        <h1 id="logo" onclick="app.unlockSystem()">BUNY<span>TUBE</span></h1>
        <div class="header-icons">
            <i class="fas fa-bell"></i>
            <i class="fas fa-crown" onclick="alert('Admin Paneli Yakında!')"></i>
        </div>
    </header>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Arama yap..." onkeyup="if(event.key === 'Enter') app.fetchVideos(this.value)">
            <i class="fas fa-microphone" style="color:var(--red)" onclick="app.startVoiceSearch()"></i>
        </div>
    </div>

    <nav id="category-bar"></nav>

    <main id="main-feed" class="feed"></main>

    <div class="bottom-nav">
        <div class="nav-item" onclick="app.unlockSystem()">
            <i class="fas fa-home"></i>
            Ana Sayfa
        </div>
        <div class="nav-item" onclick="app.blockShorts()">
            <i class="fas fa-bolt"></i>
            Shorts
        </div>
        <div class="nav-item" onclick="app.startVoiceSearch()">
            <i class="fas fa-plus-circle" style="font-size: 30px;"></i>
        </div>
        <div class="nav-item" onclick="alert('Abonelikler yakında!')">
            <i class="fas fa-layer-group"></i>
            Abonelikler
        </div>
        <div class="nav-item" onclick="alert('Kütüphane yakında!')">
            <i class="fas fa-play-circle"></i>
            Siz
        </div>
    </div>

    <div id="player">
        <div class="player-nav">
            <i class="fas fa-chevron-down" onclick="app.closePlayer()"></i>
            <span id="playing-title" style="font-size: 12px; flex:1; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 10px;">Yükleniyor...</span>
            <i class="fas fa-times" onclick="app.closePlayer()"></i>
        </div>
        <div id="player-box"></div>
        <div id="suggestion-list"></div>
    </div>

    <script>
    const app = {
        KEY: 'AIzaSyAJmuNSyU1AOn0z_jKZIpJNz-nUAZkt388', // Senin anahtarın
        stats: JSON.parse(localStorage.getItem('b_stats')) || {},

        init() {
            this.renderCats();
            this.fetchVideos("popüler videolar"); // Kesin video çıkarma garantisi
        },

        renderCats() {
            const cats = ["Hepsi", "Müzik", "Oyun", "Canlı", "Teknoloji", "Mix"];
            document.getElementById('category-bar').innerHTML = cats.map(c => `<button onclick="app.fetchVideos('${c}')">${c}</button>`).join('');
        },

        async fetchVideos(q) {
            const feed = document.getElementById('main-feed');
            feed.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:gray;">Yükleniyor...</div>';
            
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(q)}&type=video&key=${this.KEY}`);
                const data = await res.json();
                
                if(data.items && data.items.length > 0) {
                    feed.innerHTML = data.items.map(v => `
                        <div class="v-card" onclick="app.play('${v.id.videoId}', '${v.snippet.title.replace(/'/g,"")}')">
                            <img src="${v.snippet.thumbnails.high.url}">
                            <div class="v-info">
                                <div class="v-text">
                                    <p>${v.snippet.title}</p>
                                    <small>${v.snippet.channelTitle} • ${this.stats[v.id.videoId] || 0} izlenme</small>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    feed.innerHTML = '<div style="grid-column:1/-1; text-align:center;">Video bulunamadı. Kotayı kontrol et!</div>';
                }
            } catch (e) {
                feed.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:red;">Bağlantı Hatası!</div>';
            }
        },

        play(id, title) {
            this.stats[id] = (this.stats[id] || 0) + 1;
            localStorage.setItem('b_stats', JSON.stringify(this.stats));
            
            const p = document.getElementById('player');
            p.style.display = 'block';
            document.getElementById('playing-title').innerText = title;
            document.getElementById('player-box').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" style="width:100%; height:100%; border:none;" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            
            this.fetchSuggestions(title);
        },

        async fetchSuggestions(title) {
            const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=6&q=${encodeURIComponent(title)}&type=video&key=${this.KEY}`);
            const data = await res.json();
            document.getElementById('suggestion-list').innerHTML = `<h4 style="margin:10px 0;">Sıradaki</h4>` + 
                data.items.map(v => `
                    <div class="suggest-item" onclick="app.play('${v.id.videoId}', '${v.snippet.title.replace(/'/g,"")}')">
                        <img src="${v.snippet.thumbnails.medium.url}">
                        <div style="flex:1">
                            <p style="font-size:12px; font-weight:bold; line-height:1.2;">${v.snippet.title}</p>
                            <small style="color:gray; font-size:10px;">${v.snippet.channelTitle}</small>
                        </div>
                    </div>
                `).join('');
        },

        blockShorts() { document.getElementById('access-denied-screen').style.display = 'flex'; },
        unlockSystem() { document.getElementById('access-denied-screen').style.display = 'none'; this.fetchVideos("popüler"); },
        closePlayer() { document.getElementById('player').style.display = 'none'; document.getElementById('player-box').innerHTML = ''; },
        
        startVoiceSearch() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'tr-TR';
            rec.onresult = (e) => this.fetchVideos(e.results[0][0].transcript);
            rec.start();
        }
    };
    window.onload = () => app.init();
    </script>
</body>
</html>
