<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNY TUBE ULTIMATE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff0000; --dark: #0f0f0f; --card: #1e1e1e; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; }
        body { background: var(--dark); color: white; padding-bottom: 70px; overflow-x: hidden; }

        /* KİLİT EKRANI (BEYİN) */
        #access-denied-screen { position: fixed; inset: 0; background: #000; z-index: 999999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .brain-content img { width: 280px; filter: hue-rotate(280deg); margin-bottom: 20px; }
        .brain-content h2 { color: var(--red); font-size: 1.8rem; letter-spacing: 3px; }

        /* HEADER */
        header { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--dark); z-index: 1000; }
        header h1 { color: white; font-weight: 900; letter-spacing: -1.5px; font-size: 1.6rem; cursor: pointer; }
        header h1 span { color: var(--red); }

        /* SEARCH */
        .search-area { padding: 5px 15px; }
        .search-box { background: #222; border-radius: 25px; display: flex; align-items: center; padding: 10px 18px; }
        .search-box input { background: none; border: none; color: white; flex: 1; outline: none; font-size: 16px; }

        /* VİDEO FEED */
        .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; padding: 10px; }
        .v-card { background: transparent; cursor: pointer; margin-bottom: 12px; }
        .v-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; background: #222; }
        .v-info { padding: 12px 5px; display: flex; gap: 12px; }
        .channel-pfp { width: 36px; height: 36px; background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .v-text p { font-size: 1rem; font-weight: 600; line-height: 1.4; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-text small { color: #aaa; font-size: 0.85rem; display: block; margin-top: 4px; }

        /* ALT NAVİGASYON */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: #0f0f0f; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2000; }
        .nav-item { text-align: center; color: white; cursor: pointer; font-size: 10px; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }

        /* PLAYER */
        #player { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; overflow-y: auto; }
        #player-box { width: 100%; aspect-ratio: 16/9; }
        .player-actions { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .sub-btn { background: white; color: black; padding: 8px 15px; border-radius: 20px; font-weight: bold; border: none; cursor: pointer; }

        /* MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 10000; }
        .modal-content { background: #111; padding: 30px; border-radius: 15px; border: 1px solid var(--red); text-align: center; width: 80%; }
        .modal-content input { width: 100%; padding: 10px; margin: 15px 0; background: #000; color: white; border: 1px solid #333; text-align: center; }
    </style>
</head>
<body>

    <div id="access-denied-screen">
        <div class="brain-content">
            <img src="https://i.pinimg.com/originals/f3/7b/d2/f37bd29f6358e72c86b72d25091c68f1.gif">
            <h2>ERİŞİM ENGELLENDİ</h2>
            <p>Ana Sayfa için logoya tıkla.</p>
        </div>
    </div>

    <header>
        <h1 onclick="app.unlockSystem()">BUNY<span>TUBE</span></h1>
        <i class="fas fa-crown" onclick="app.openAdmin()"></i>
    </header>

    <div class="search-area">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="YouTube'da ara..." onkeyup="if(event.key === 'Enter') app.search()">
            <i class="fas fa-search" onclick="app.search()"></i>
        </div>
    </div>

    <main id="main-feed" class="feed"></main>

    <div class="bottom-nav">
        <div class="nav-item" onclick="app.unlockSystem()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item" onclick="app.blockShorts()"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-item" onclick="app.showSubs()"><i class="fas fa-layer-group"></i>Abonelikler</div>
        <div class="nav-item" onclick="app.openAdmin()"><i class="fas fa-user-circle"></i>Admin</div>
    </div>

    <div id="player">
        <div style="padding: 10px;"><i class="fas fa-times" onclick="app.closePlayer()" style="font-size: 24px;"></i></div>
        <div id="player-box"></div>
        <div class="player-actions">
            <div>
                <h3 id="p-title" style="font-size: 1rem;">Video Başlığı</h3>
                <small id="p-stats" style="color: gray;"></small>
            </div>
            <button id="sub-btn" class="sub-btn" onclick="app.toggleSub()">Abone Ol</button>
        </div>
        <div id="suggest-feed" style="padding: 15px;"></div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h3>ADMİN GİRİŞİ</h3>
            <input type="password" id="admin-pass" placeholder="Şifre">
            <button onclick="app.checkAdmin()" style="background:var(--red); color:white; padding:10px 20px; border:none; border-radius:5px;">GİRİŞ</button>
            <button onclick="app.closeAdmin()" style="background:none; color:gray; border:none; margin-top:10px; display:block; width:100%;">İptal</button>
        </div>
    </div>

    <script>
    const app = {
        KEY: 'AIzaSyAJmuNSyU1AOn0z_jKZIpJNz-nUAZkt388',
        subs: JSON.parse(localStorage.getItem('my_subs')) || [],
        currentChannel: '',

        init() { this.fetchVideos("trend videolar"); },

        fmt(n) { return n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'B' : n; },

        async fetchVideos(q) {
            const feed = document.getElementById('main-feed');
            feed.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:50px;">Yükleniyor...</p>';
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(q)}&type=video&key=${this.KEY}`);
                const data = await res.json();
                const ids = data.items.map(v => v.id.videoId).join(',');
                const statRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics,snippet&id=${ids}&key=${this.KEY}`);
                const statData = await statRes.json();
                feed.innerHTML = statData.items.map(v => `
                    <div class="v-card" onclick="app.play('${v.id}', '${v.snippet.title.replace(/'/g,"")}', '${v.snippet.channelTitle}', '${this.fmt(v.statistics.viewCount)}')">
                        <img src="${v.snippet.thumbnails.high.url}">
                        <div class="v-info">
                            <div class="channel-pfp">${v.snippet.channelTitle[0]}</div>
                            <div class="v-text"><p>${v.snippet.title}</p><small>${v.snippet.channelTitle} • ${this.fmt(v.statistics.viewCount)} izlenme</small></div>
                        </div>
                    </div>`).join('');
            } catch (e) { feed.innerHTML = '<p style="text-align:center; padding:50px;">Hata oluştu.</p>'; }
        },

        play(id, title, channel, views) {
            this.currentChannel = channel;
            document.getElementById('player').style.display = 'block';
            document.getElementById('p-title').innerText = title;
            document.getElementById('p-stats').innerText = `${channel} • ${views} izlenme`;
            document.getElementById('sub-btn').innerText = this.subs.includes(channel) ? "Abone Olundu" : "Abone Ol";
            document.getElementById('player-box').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
        },

        toggleSub() {
            if(this.subs.includes(this.currentChannel)) {
                this.subs = this.subs.filter(c => c !== this.currentChannel);
                document.getElementById('sub-btn').innerText = "Abone Ol";
            } else {
                this.subs.push(this.currentChannel);
                document.getElementById('sub-btn').innerText = "Abone Olundu";
            }
            localStorage.setItem('my_subs', JSON.stringify(this.subs));
        },

        showSubs() {
            if(this.subs.length === 0) return alert("Henüz abone olduğun kanal yok!");
            this.fetchVideos(this.subs.join(" "));
        },

        search() { const v = document.getElementById('search-input').value; if(v) this.fetchVideos(v); },
        blockShorts() { document.getElementById('access-denied-screen').style.display = 'flex'; },
        unlockSystem() { document.getElementById('access-denied-screen').style.display = 'none'; this.fetchVideos("trend"); },
        closePlayer() { document.getElementById('player').style.display = 'none'; document.getElementById('player-box').innerHTML = ''; },
        
        openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; },
        closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; },
        checkAdmin() {
            const p = document.getElementById('admin-pass').value;
            if(p === "Muhiy.1905") {
                alert("Hoş geldin Muhiy! ADMİN ONAYLANDI.");
                this.closeAdmin();
            } else { alert("Şifre Yanlış!"); }
        }
    };
    window.onload = () => app.init();
    </script>
</body>
</html>
