<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNY-Tube Premium</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        
        /* Navbar */
        .header { position: sticky; top: 0; background: #000; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; color: white; text-decoration: none; }
        .logo span { background: #ff0000; color: white; padding: 2px 6px; border-radius: 6px; margin-left: 4px; }

        /* Arama Kutusu */
        .search-area { padding: 10px 15px; display: flex; gap: 8px; }
        input { flex: 1; background: #121212; border: 1px solid #333; color: white; padding: 12px 18px; border-radius: 25px; outline: none; font-size: 1rem; }
        .search-btn { background: #222; border: none; color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        /* Video Grid */
        #video-grid { padding: 10px 0 80px 0; }
        .video-card { width: 100%; margin-bottom: 15px; cursor: pointer; animation: fadeIn 0.5s ease; }
        .video-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .video-info { padding: 12px; display: flex; gap: 12px; }
        .v-text h3 { font-size: 0.95rem; line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-text p { font-size: 0.8rem; color: #aaa; }

        /* Alt Navigasyon */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #222; z-index: 1000; }
        .nav-item { text-align: center; color: #aaa; font-size: 0.7rem; text-decoration: none; flex: 1; }
        .nav-item i { font-size: 1.3rem; margin-bottom: 4px; display: block; }
        .nav-item.active { color: white; }

        /* Fullscreen Player */
        .player-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; z-index: 2000; }
        .player-header { padding: 15px; display: flex; align-items: center; gap: 15px; background: #111; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; background: #000; }
        .v-desc { padding: 15px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="header">
        <a href="#" class="logo">BUNY<span>Tube</span></a>
        <i class="fas fa-bell fa-lg"></i>
    </header>

    <div class="search-area">
        <input type="text" id="search-input" placeholder="YouTube'da ara...">
        <button class="search-btn" onclick="search()"><i class="fas fa-search"></i></button>
    </div>

    <div id="video-grid">
        </div>

    <nav class="nav-bar">
        <a href="#" class="nav-item active" onclick="loadHome()"><i class="fas fa-home"></i>Ana Sayfa</a>
        <a href="#" class="nav-item" onclick="alert('Shorts özelliği yakında!')"><i class="fas fa-bolt"></i>Shorts</a>
        <a href="#" class="nav-item"><i class="fas fa-plus-circle fa-2x" style="color:white;"></i></a>
        <a href="#" class="nav-item"><i class="fas fa-layer-group"></i>Abonelik</a>
        <a href="#" class="nav-item"><i class="fas fa-video"></i>Kitaplık</a>
    </nav>

    <div id="player" class="player-overlay">
        <div class="player-header" onclick="closeVideo()">
            <i class="fas fa-chevron-down"></i>
            <span id="player-title" style="font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Video Oynatılıyor</span>
        </div>
        <div id="iframe-container"></div>
        <div class="v-desc">
            <h2 id="v-title-full" style="font-size: 1.1rem; margin-bottom: 10px;"></h2>
            <p style="color:#aaa; font-size:0.9rem;">Reklamsız BUNY-Tube Deneyimi</p>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0'; // Senin verdiğin anahtar

        async function loadHome() {
            const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&chart=mostPopular&regionCode=TR&maxResults=20&key=${API_KEY}`;
            fetchAndRender(url);
        }

        async function search() {
            const q = document.getElementById('search-input').value;
            if(!q) return;
            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&maxResults=20&key=${API_KEY}`;
            fetchAndRender(url);
        }

        async function fetchAndRender(url) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = "<p style='text-align:center; padding:20px;'>Yükleniyor...</p>";
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                grid.innerHTML = "";
                
                data.items.forEach(item => {
                    const id = item.id.videoId || item.id;
                    const v = item.snippet;
                    grid.innerHTML += `
                        <div class="video-card" onclick="openVideo('${id}', '${v.title.replace(/'/g, "\\'")}')">
                            <img src="${v.thumbnails.high.url}">
                            <div class="video-info">
                                <div class="v-text">
                                    <h3>${v.title}</h3>
                                    <p>${v.channelTitle}</p>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (e) {
                grid.innerHTML = "<p style='text-align:center;'>API Hatası! Kotan dolmuş olabilir.</p>";
            }
        }

        function openVideo(id, title) {
            document.getElementById('player').style.display = 'flex';
            document.getElementById('player-title').innerText = title;
            document.getElementById('v-title-full').innerText = title;
            document.getElementById('iframe-container').innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allowfullscreen allow="autoplay"></iframe>
            `;
        }

        function closeVideo() {
            document.getElementById('player').style.display = 'none';
            document.getElementById('iframe-container').innerHTML = "";
        }

        // İlk açılışta trendleri getir
        window.onload = loadHome;
    </script>
</body>
</html>
