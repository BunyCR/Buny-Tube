<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNY-Tube Prestige</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="neural-shield">
        <div class="shield-card">
            <i class="fas fa-brain brain-icon"></i>
            <h2 style="font-family:'Orbitron';">ERİŞİM ENGELLENDİ</h2>
            <p style="margin: 25px 0; line-height:1.6; color:#888;">
                Muhammed Ali: "Kanka, kısa videolar odaklanma yeteneğini yok eder. Geleceğin için uzun ve kaliteli içeriklere yönel!"
            </p>
            <button onclick="sys.ui.closeShield()" style="width:100%; padding:20px; background:red; color:white; border:none; border-radius:15px; font-weight:900; font-size:1.1rem; cursor:pointer;">EMRET KRAL</button>
        </div>
    </div>

    <header>
        <div class="logo" onclick="location.reload()">BUNY<span>Tube</span> <i class="fas fa-crown" style="color:gold; font-size:1.2rem;"></i></div>
        <div class="search-bar">
            <div class="search-input-wrap">
                <input type="text" id="search-input" placeholder="Kaosu ve Geleceği Ara..." onkeypress="if(event.key==='Enter') sys.engine.search()">
            </div>
            <div onclick="sys.engine.search()" style="width:50px; height:50px; border-radius:50%; background:#181818; display:flex; align-items:center; justify-content:center; color:red; cursor:pointer; border:1px solid #272727;">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </header>

    <main class="feed" id="main-feed"></main>

    <div id="player-ui">
        <div class="player-back" onclick="sys.ui.closePlayer()">
            <i class="fas fa-chevron-down"></i> VİDEOYU KAPAT VE SİSTEME DÖN
        </div>
        <div id="video-frame" style="width:100%; aspect-ratio:16/9; background:#000;"></div>
        <div style="padding:25px; overflow-y:auto;">
            <h2 id="p-title" style="font-size:1.2rem; margin-bottom:10px;"></h2>
            <p style="color:red; font-weight:bold;">Muhammed Ali Prestige Player v1.0</p>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="location.reload()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item" onclick="sys.ui.openShield()"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-item"><i class="fas fa-fire"></i>Trendler</div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
