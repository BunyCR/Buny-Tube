<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BunyTube</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 80px; }
        
        /* HAREKETLİ BAKIM EKRANI */
        #bakim { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        .ani { font-size: 30px; color: #00f2ff; text-shadow: 0 0 15px #00f2ff; animation: fly 2s infinite ease-in-out; }
        @keyframes fly { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
        .key { margin-top: 100px; opacity: 0.1; cursor: pointer; font-size: 30px; }

        /* ARAYÜZ */
        header { padding: 15px; background: #111; display: flex; gap: 10px; sticky; top: 0; z-index: 100; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; background: #222; color: #fff; }
        button { padding: 10px; background: #ff0000; color: #fff; border: none; border-radius: 5px; font-weight: bold; }
        
        #results { padding: 10px; display: grid; gap: 20px; }
        .v-card { cursor: pointer; }
        .v-card img { width: 100%; border-radius: 10px; aspect-ratio: 16/9; object-fit: cover; }
        
        #player { position: fixed; inset: 0; background: #000; display: none; z-index: 10000; }
        .close { padding: 20px; color: #00f2ff; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="bakim">
    <div class="ani">BUNYTUBE BAKIMDA</div>
    <div class="key" onclick="unlock()">🔑</div>
</div>

<header>
    <div style="color:red; font-weight:900; font-size:20px;">BunyTube</div>
    <input type="text" id="q" placeholder="Video adı yaz...">
    <button onclick="search()">ARA</button>
</header>

<div id="results"></div>

<div id="player">
    <div class="close" onclick="closePlayer()">✖ KAPAT</div>
    <div id="video-area"></div>
</div>

<script>
    // Bakım kontrolü
    if(localStorage.getItem('buny_mod') === 'true') document.getElementById('bakim').style.display = 'flex';

    function unlock() {
        if(prompt("Şifre:") === "Muhiy.1905") {
            localStorage.setItem('buny_mod', 'false');
            location.reload();
        }
    }

    // YENİ YÖNTEM: YouTube'un açık arama motoru köprüsü (Google Script bypass)
    async function search() {
        const query = document.getElementById('q').value;
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = "Aranıyor...";

        try {
            // Bu link, YouTube'un video sonuçlarını engel takılmadan JSON formatında getiren bir köprüdür
            const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.youtube.com/results?search_query=' + query + '&pbj=1')}`, {
                headers: { 'x-requested-with': 'XMLHttpRequest' }
            });
            const data = await res.json();
            
            // Veri içinden Video ID'lerini temiz bir şekilde ayıklama (Regex)
            const ids = [...data.contents.matchAll(/"videoId":"([^"]+)"/g)].map(m => m[1]);
            const titles = [...data.contents.matchAll(/"title":\{"runs":\[\{"text":"([^"]+)"/g)].map(m => m[1]);

            if(ids.length > 0) {
                resDiv.innerHTML = "";
                const unique = [...new Set(ids)].slice(0, 10);
                unique.forEach((id, i) => {
                    resDiv.innerHTML += `
                        <div class="v-card" onclick="play('${id}')">
                            <img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg">
                            <div style="margin-top:8px;">${titles[i] || 'Video ' + (i+1)}</div>
                        </div>`;
                });
            } else {
                resDiv.innerHTML = "Sonuç yok. Başka bir şey dene patron.";
            }
        } catch (e) {
            resDiv.innerHTML = "Bağlantı hatası!";
        }
    }

    function play(id) {
        document.getElementById('player').style.display = 'block';
        // Reddedilme hatasını aşmak için YouTube-NoCookie kullanımı
        document.getElementById('video-area').innerHTML = `
            <iframe width="100%" height="300" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
    }

    function closePlayer() {
        document.getElementById('player').style.display = 'none';
        document.getElementById('video-area').innerHTML = "";
    }
</script>

</body>
</html>
