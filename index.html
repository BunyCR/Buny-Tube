<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BunyTube</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --v-red: #ff0000; --v-black: #000000; --neon: #00f2ff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--v-black); color: white; overflow-x: hidden; padding-bottom: 80px; }

        /* --- HAREKETLİ BAKIM EKRANI --- */
        #bakim-ekran { 
            position: fixed; inset: 0; background: #000; z-index: 1000000; 
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
        }
        .ani-logo { font-size: 80px; color: var(--v-red); animation: pulse 2s infinite; }
        .ani-text { 
            margin-top: 20px; font-size: 26px; font-weight: 900; color: var(--neon);
            text-shadow: 0 0 15px var(--neon);
            animation: float 3s ease-in-out infinite;
        }
        .patron-key { margin-top: 80px; font-size: 30px; color: #111; cursor: pointer; opacity: 0.5; }

        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* --- HEADER --- */
        header { position: sticky; top: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111; }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; display: flex; align-items: center; gap: 8px; }
        .logo i { color: var(--v-red); }

        /* --- SEARCH --- */
        .search-section { padding: 15px; }
        .search-box { background: #1a1a1a; border-radius: 50px; display: flex; align-items: center; padding: 5px 20px; border: 1px solid #333; }
        .search-box input { flex: 1; background: none; border: none; color: white; padding: 12px; font-size: 16px; outline: none; }

        /* --- FEED --- */
        .v-card { width: 100%; margin-bottom: 15px; cursor: pointer; border-bottom: 1px solid #0f0f0f; }
        .v-thumb { width: 100%; aspect-ratio: 16/9; position: relative; background: #111; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-title { padding: 12px; font-size: 15px; font-weight: 500; line-height: 1.4; color: #efefef; }

        /* --- PLAYER --- */
        #v-player { position: fixed; inset: 0; background: #000; z-index: 2000000; display: none; flex-direction: column; }
        .close-p { padding: 15px; font-size: 25px; color: var(--neon); }

        /* --- NAV --- */
        nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: #000; border-top: 1px solid #111; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { color: #888; text-align: center; font-size: 11px; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>

    <div id="bakim-ekran">
        <i class="fab fa-youtube ani-logo"></i>
        <div class="ani-text">SİSTEM BAKIMDA</div>
        <p style="color: #333; margin-top: 10px;">BunyTube Muhammed Ali Tarafından Güncelleniyor</p>
        <div class="patron-key" onclick="app.patronCheck()"><i class="fas fa-key"></i></div>
    </div>

    <header>
        <div class="logo"><i class="fab fa-youtube"></i> <span>BunyTube</span></div>
        <i class="fas fa-user-shield" style="font-size: 22px; color: #222;" onclick="app.patronCheck()"></i>
    </header>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="q" placeholder="Hangi videoyu arıyoruz patron?" onkeyup="if(event.key==='Enter') app.search()">
            <i class="fas fa-search" onclick="app.search()" style="color: var(--neon);"></i>
        </div>
    </div>

    <div id="feed"></div>

    <div id="v-player">
        <div class="close-p" onclick="app.closePlayer()"><i class="fas fa-chevron-down"></i></div>
        <div id="p-frame" style="width:100%; height:100%;"></div>
    </div>

    <nav>
        <div class="nav-item active"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-item"><i class="fas fa-plus-circle" style="font-size: 30px; color: var(--v-red);"></i></div>
        <div class="nav-item"><i class="fas fa-layer-group"></i>Abonelik</div>
        <div class="nav-item" onclick="app.patronCheck()"><i class="fas fa-user-circle"></i>Admin</div>
    </nav>

    <script>
    const app = {
        // EN STABİL YEDEK SUNUCULAR (Invidious & Piped Karışık)
        servers: [
            'https://invidious.flokinet.to/api/v1',
            'https://invidious.sethforprivacy.com/api/v1',
            'https://pipedapi.kavin.rocks'
        ],

        init() {
            if(localStorage.getItem('buny_bakim') === 'true') document.getElementById('bakim-ekran').style.display = 'flex';
        },

        async search() {
            const query = document.getElementById('q').value;
            if(!query) return;
            const feed = document.getElementById('feed');
            feed.innerHTML = '<div style="text-align:center; padding:50px;"><i class="fas fa-spinner fa-spin" style="font-size:30px; color:var(--neon);"></i><br><p style="margin-top:15px; color:var(--neon);">Derin Arama Başlatıldı...</p></div>';

            for(let srv of this.servers) {
                try {
                    // Invidious API yapısı
                    const url = srv.includes('invidious') 
                                ? `${srv}/search?q=${encodeURIComponent(query)}&type=video`
                                : `${srv}/search?q=${encodeURIComponent(query)}&filter=videos`;
                    
                    const res = await fetch(url);
                    const data = await res.json();
                    
                    const results = srv.includes('invidious') ? data : data.content;

                    if(results && results.length > 0) {
                        feed.innerHTML = results.map(v => {
                            const id = v.videoId || (v.url ? v.url.split('=')[1] : null);
                            if(!id) return '';
                            const thumb = v.videoThumbnails ? v.videoThumbnails[3].url : (v.thumbnail || '');
                            return `
                            <div class="v-card" onclick="app.play('${id}')">
                                <div class="v-thumb"><img src="${thumb}" onerror="this.src='https://via.placeholder.com/169?text=BunyTube'"></div>
                                <div class="v-title">${v.title}</div>
                            </div>`;
                        }).join('');
                        return;
                    }
                } catch(e) { console.log("Hata: " + srv + " yanıt vermedi."); }
            }
            feed.innerHTML = '<p style="text-align:center; padding:50px; color:red;">Tüm sunucular şu an yoğun patron. <br> Lütfen 3-4 saniye sonra tekrar ara!</p>';
        },

        play(id) {
            document.getElementById('v-player').style.display = 'flex';
            document.getElementById('p-frame').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" style="width:100%; height:300px; border:none;" allowfullscreen></iframe>`;
        },

        closePlayer() {
            document.getElementById('v-player').style.display = 'none';
            document.getElementById('p-frame').innerHTML = '';
        },

        patronCheck() {
            const pw = prompt("Patron Şifresini Gir:");
            if(pw === "Muhiy.1905") {
                const durum = localStorage.getItem('buny_bakim') === 'true';
                const yeni = confirm(durum ? "Bakım modunu kapatıp sistemi açmak istiyor musunuz?" : "Sistemi bakım moduna almak istiyor musunuz?");
                if(yeni) {
                    localStorage.setItem('buny_bakim', !durum);
                    location.reload();
                }
            } else { alert("Yanlış anahtar patron!"); }
        }
    };
    window.onload = () => app.init();
    </script>
</body>
</html>
