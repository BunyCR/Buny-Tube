<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNY-Tube Prestige</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="neural-shield">
        <div class="shield-card">
            <i class="fas fa-brain brain-icon"></i>
            <h2 style="font-family:'Orbitron'; margin-bottom:20px;">ERİŞİM ENGELLENDİ</h2>
            <p>Muhammed Ali: "Zihnini korumak için burayı mühürledim. Kaliteli uzun videolarla beynini besle!"</p>
            <button onclick="sys.ui.closeShield()" style="margin-top:20px; width:100%; padding:15px; background:red; color:#fff; border:none; border-radius:10px; font-weight:900;">TAMAM KRAL</button>
        </div>
    </div>

    <header>
        <div class="brand">BUNY<span>Tube</span></div>
        <div class="search-wrapper">
            <div class="search-input"><input type="text" id="master-query" placeholder="Ara..."></div>
            <div onclick="sys.engine.voice()" style="color:red; margin-left:10px;"><i class="fas fa-microphone fa-lg"></i></div>
        </div>
    </header>

    <main class="grid" id="feed-box"></main>

    <div id="player-overlay">
        <div class="p-nav" onclick="sys.ui.minimize()"><i class="fas fa-chevron-down"></i> KAPAT VE SİSTEME DÖN</div>
        <div id="video-target" style="width:100%; aspect-ratio:16/9;"></div>
        <div style="padding:20px;"><h2 id="v-title"></h2></div>
    </div>

    <nav style="position:fixed; bottom:0; width:100%; background:#000; display:flex; justify-content:space-around; padding:20px; border-top:1px solid #222;">
        <div onclick="location.reload()"><i class="fas fa-home"></i></div>
        <div onclick="sys.ui.openShield()" style="color:#444;"><i class="fas fa-bolt"></i></div>
        <div style="color:#444;"><i class="fas fa-user"></i></div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
