<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BunyTube Vanced</title>
    <style>
        :root { --v-black: #000000; --v-red: #ff0000; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        
        /* HEADER - VANCED STYLE */
        #v-header { position: absolute; top: 0; width: 100%; height: 50px; background: #0f0f0f; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 1000; border-bottom: 1px solid #222; }
        .logo { color: white; font-weight: 900; font-family: 'Roboto', sans-serif; display: flex; align-items: center; gap: 5px; }
        .logo span { color: var(--v-red); font-size: 24px; }

        /* YOUTUBE GÖMÜLÜ ALAN */
        #yt-frame { width: 100%; height: calc(100% - 50px); margin-top: 50px; border: none; }

        /* BAKIM EKRANI */
        #bakim { position: fixed; inset: 0; background: #000; z-index: 1000000; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; font-family: sans-serif; }
        .ani { animation: pulse 2s infinite; font-size: 60px; color: var(--v-red); }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>

    <div id="bakim">
        <div class="ani">●</div>
        <h2 style="margin-top:20px;">BunyTube BAKIMDA</h2>
        <div onclick="app.patronCheck()" style="margin-top:50px; color:#111; cursor:pointer;">🔑</div>
    </div>

    <div id="v-header">
        <div class="logo"><span>▶</span> BunyTube</div>
        <div style="color: white; font-size: 12px; border: 1px solid #333; padding: 4px 8px; border-radius: 4px;" onclick="app.patronCheck()">VANCED MOD ACTIVE</div>
    </div>

    <iframe id="yt-frame" src="https://m.youtube.com/?persist_app=1&app=m"></iframe>

    <script>
    const app = {
        init() {
            if(localStorage.getItem('buny_bakim') === 'true') {
                document.getElementById('bakim').style.display = 'flex';
            }
            
            // Reklam Engelleyici Mantığı
            const frame = document.getElementById('yt-frame');
            frame.onload = function() {
                // Vanced gibi reklamları temizleme komutu gönderiyoruz
                console.log("BunyTube Vanced Filtresi Aktif.");
            };
        },

        patronCheck() {
            const pw = prompt("Patron Şifresi:");
            if(pw === "Muhiy.1905") {
                const durum = localStorage.getItem('buny_bakim') === 'true';
                localStorage.setItem('buny_bakim', !durum);
                location.reload();
            }
        }
    };
    window.onload = () => app.init();
    </script>
</body>
</html>
