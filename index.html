<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUNY-Tube V2500 | Persistence Mode</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">

    <style>
        :root {
            --m-red: #ff0000;
            --m-black: #000000;
            --m-surface: #0a0a0a;
            --m-border: #1a1a1a;
            --m-glow: 0 0 40px rgba(255, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--m-black); color: #fff; overflow-x: hidden; padding-bottom: 120px; }

        /* [SHORTS LOCK] */
        #shorts-lock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .lock-box { border: 2px solid var(--m-red); padding: 50px; border-radius: 40px; text-align: center; background: #050505; box-shadow: var(--m-glow); }
        .lock-box i { font-size: 5rem; color: var(--m-red); margin-bottom: 20px; }

        /* [HEADER] */
        header { position: sticky; top: 0; z-index: 10000; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); padding: 20px; border-bottom: 1px solid var(--m-border); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 900; }
        .logo span { background: var(--m-red); padding: 2px 8px; border-radius: 6px; }

        /* [MAIN FEED] */
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 15px; }
        .card { background: #000; margin-bottom: 20px; }
        .thumb { width: 100%; aspect-ratio: 21 / 9; position: relative; overflow: hidden; border-radius: 8px; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }
        .meta { display: flex; padding: 15px; gap: 15px; }
        .pfp { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--m-red); display: flex; align-items: center; justify-content: center; color: var(--m-red); flex-shrink: 0; }
        
        /* [MINI PLAYER - VİDEO GİTMESİN DİYE] */
        #mini-container {
            position: fixed; bottom: 100px; right: 20px; width: 180px; aspect-ratio: 16/9;
            z-index: 99999; border: 2px solid var(--m-red); border-radius: 12px;
            overflow: hidden; background: #000; display: none; box-shadow: var(--m-glow);
        }

        /* [FULL PLAYER OVERLAY] */
        #player-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 50000; display: none; flex-direction: column;
        }
        .p-top { padding: 20px; font-weight: 900; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 15px; }

        /* [NAVBAR] */
        nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 20px 0; z-index: 100000; }
        .nav-item { text-align: center; color: #555; font-size: 0.8rem; font-weight: 900; }
        .nav-item.active { color: #fff; }
        .nav-item i { display: block; font-size: 1.8rem; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="shorts-lock">
        <div class="lock-box">
            <i class="fas fa-brain"></i>
            <h2 style="color:var(--m-red)">ERİŞİM REDDEDİLDİ</h2>
            <p style="margin:20px 0; color:#888;">Muhammed Ali: Zihin sağlığın için Shorts mühürlendi!</p>
            <button onclick="titan.ui.closeShorts()" style="background:var(--m-red); color:#fff; border:none; padding:15px 30px; border-radius:15px; font-weight:900;">TAMAM KRAL</button>
        </div>
    </div>

    <header>
        <div class="logo" onclick="titan.engine.home()">BUNY<span>Tube</span></div>
    </header>

    <main class="grid" id="feed"></main>

    <div id="mini-container" onclick="titan.ui.expandPlayer()"></div>

    <div id="player-overlay">
        <div class="p-top" onclick="titan.ui.minimizePlayer()">
            <i class="fas fa-chevron-down"></i> VİDEOYU KÜÇÜLT (GİTMESİN)
        </div>
        <div id="main-video-slot" style="width:100%; aspect-ratio:16/9;"></div>
        <div id="p-info" style="padding:20px;">
            <h2 id="p-title"></h2>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="titan.engine.home()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item" onclick="titan.ui.openShorts()"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-item"><i class="fas fa-crown"></i>Profil</div>
    </nav>

    <script>
        const titan = {
            state: { currentId: null, isMinimized: false },
            config: {
                key: 'AIzaSyBfXaM09l-IBo2KoDSz02f-4XXD2NoAco0',
                backups: [
                    {id: 'lXr19zpQ4h0', t: '2050 Teknolojisi🚀'},
                    {id: 'GWltQO23mQw', t: 'Uzay Gerçekleri'},
                    {id: '5wHlBAH2YZ0', t: 'Alper Gezeravcı Uzayda'}
                ]
            },
            ui: {
                openShorts: () => document.getElementById('shorts-lock').style.display='flex',
                closeShorts: () => document.getElementById('shorts-lock').style.display='none',
                
                // VİDEODAN ÇIKINCA VİDEO GİTMESİN DİYE BURASI ÇALIŞIR
                minimizePlayer: function() {
                    const video = document.getElementById('main-video-slot').innerHTML;
                    if(!video) return;
                    document.getElementById('player-overlay').style.display = 'none';
                    document.getElementById('mini-container').style.display = 'block';
                    document.getElementById('mini-container').innerHTML = video;
                    titan.state.isMinimized = true;
                },
                expandPlayer: function() {
                    const video = document.getElementById('mini-container').innerHTML;
                    document.getElementById('player-overlay').style.display = 'flex';
                    document.getElementById('main-video-slot').innerHTML = video;
                    document.getElementById('mini-container').style.display = 'none';
                    titan.state.isMinimized = false;
                }
            },
            engine: {
                home: async function() {
                    const box = document.getElementById('feed');
                    try {
                        const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=teknoloji&type=video&maxResults=10&key=${titan.config.key}`);
                        const d = await r.json();
                        box.innerHTML = "";
                        d.items.forEach(v => this.draw(box, v.id.videoId, v.snippet.title, v.snippet.thumbnails.high.url));
                    } catch(e) {
                        box.innerHTML = "";
                        titan.config.backups.forEach(v => this.draw(box, v.id, v.t, `https://img.youtube.com/vi/${v.id}/hqdefault.jpg`));
                    }
                },
                draw: function(box, id, title, thumb) {
                    box.innerHTML += `
                        <div class="card" onclick="titan.engine.play('${id}', '${title.replace(/'/g,"")}')">
                            <div class="thumb"><img src="${thumb}"><div style="position:absolute;bottom:10px;right:10px;background:#000;padding:5px;font-size:0.7rem;">21:9</div></div>
                            <div class="meta"><div class="pfp"><i class="fas fa-crown"></i></div><div><h3>${title}</h3></div></div>
                        </div>`;
                },
                play: function(id, title) {
                    titan.state.currentId = id;
                    document.getElementById('player-overlay').style.display = 'flex';
                    document.getElementById('p-title').innerText = title;
                    document.getElementById('main-video-slot').innerHTML = `<iframe id="yt-frame" src="https://www.youtube.com/embed/${id}?autoplay=1&enablejsapi=1&playsinline=1" style="width:100%; height:100%; border:none;" allow="autoplay; fullscreen"></iframe>`;
                    document.getElementById('mini-container').style.display = 'none';
                }
            }
        };

        window.onload = () => titan.engine.home();
    </script>
</body>
</html>
