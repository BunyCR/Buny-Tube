<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNY TUBE - ULTIMATE v10</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --red: #ff0000; --dark: #0f0f0f; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; }
        body { background: var(--dark); color: white; padding-bottom: 80px; }

        /* DUYURU BANNER */
        #announcement-banner {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white; padding: 8px 0; font-size: 14px; font-weight: bold; overflow: hidden; white-space: nowrap; position: sticky; top: 0; z-index: 1001;
        }
        .marquee { display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        /* HEADER & FEED */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        header h1 { font-weight: 900; letter-spacing: -1.5px; font-size: 1.7rem; cursor: pointer; }
        header h1 span { color: var(--red); }
        .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; padding: 10px; }
        .v-card { cursor: pointer; background: #1a1a1a; border-radius: 12px; overflow: hidden; }
        .v-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }

        /* PUANLAMA MODALI */
        #rating-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 50000; display: none; align-items: center; justify-content: center; }
        .rating-content { background: #1a1a1a; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; border: 1px solid gold; }
        .stars { margin: 20px 0; font-size: 30px; color: #444; }
        .stars i { cursor: pointer; transition: 0.3s; }
        .stars i.active { color: gold; text-shadow: 0 0 10px gold; }
        #rating-comment { width: 100%; background: #000; color: white; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-top: 10px; }

        /* ADMIN & NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: #0f0f0f; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 2000; }
        .nav-item { text-align: center; color: white; cursor: pointer; font-size: 11px; flex: 1; }
        #admin-dashboard { position: fixed; inset: 0; background: #000; z-index: 11000; display: none; padding: 25px; overflow-y: auto; }
        .admin-btn { background: var(--red); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 10px; font-weight: bold; }
        
        #player { position: fixed; inset: 0; background: #000; z-index: 3000; display: none; }
        #player-box { width: 100%; aspect-ratio: 16/9; }
        .sub-btn { background: white; color: black; padding: 8px 15px; border-radius: 20px; border: none; font-weight: bold; margin: 10px; }
    </style>
</head>
<body>

    <div id="announcement-banner"><div class="marquee" id="marquee-text">Duyuru: Şimdilik bir konu yok olduğunda haber vereceğiz.</div></div>

    <header><h1 onclick="location.reload()">BUNY<span>TUBE</span></h1><i class="fas fa-crown" onclick="app.openAdminModal()" style="color:gold"></i></header>

    <main id="main-feed" class="feed"></main>

    <div id="rating-modal">
        <div class="rating-content">
            <i class="fas fa-star" style="font-size: 40px; color: gold;"></i>
            <h2 style="margin-top:15px">Bizi Puanla!</h2>
            <p style="font-size: 13px; color: gray; margin-top: 5px;">Uygulamamızı beğendin mi? Fikrin bizim için önemli.</p>
            <div class="stars" id="star-container">
                <i class="fas fa-star" data-v="1"></i><i class="fas fa-star" data-v="2"></i><i class="fas fa-star" data-v="3"></i><i class="fas fa-star" data-v="4"></i><i class="fas fa-star" data-v="5"></i>
            </div>
            <textarea id="rating-comment" rows="3" placeholder="Yorumun (isteğe bağlı)..."></textarea>
            <button onclick="app.submitRating()" class="admin-btn" style="background: gold; color: black;">GÖNDER</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item" onclick="location.reload()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item" onclick="app.showSubs()"><i class="fas fa-heart"></i>Abonelikler</div>
        <div class="nav-item" onclick="app.openAdminModal()"><i class="fas fa-user-shield"></i>Admin</div>
    </div>

    <div id="admin-dashboard">
        <div style="display:flex; justify-content:space-between"><h2>ADMİN MERKEZİ</h2><i class="fas fa-times" onclick="app.closeAdminPanel()"></i></div>
        <div style="margin-top:20px; background:#111; padding:15px; border-radius:10px;">
            <h4>Duyuru Yaz</h4>
            <input type="text" id="ann-input" style="width:100%; padding:10px; margin:10px 0; background:#000; color:white; border:1px solid #333;">
            <button onclick="app.updateAnn()" class="admin-btn">YAYINLA</button>
        </div>
        <div style="margin-top:20px; background:#111; padding:15px; border-radius:10px;">
            <h3 style="color:gold">Gelen Puanlar & Yorumlar</h3>
            <div id="admin-ratings-list" style="margin-top:10px; font-size:12px; color:#aaa;">Henüz puanlama yok.</div>
        </div>
    </div>

    <div id="player">
        <div style="padding:15px;"><i class="fas fa-chevron-down" onclick="app.closePlayer()" style="font-size:25px"></i></div>
        <div id="player-box"></div>
        <div id="p-detail" style="padding:15px;">
            <h3 id="p-title">Başlık</h3>
            <button id="sub-btn" class="sub-btn" onclick="app.toggleSub()">Abone Ol</button>
        </div>
    </div>

    <script>
    const app = {
        KEY: 'AIzaSyAJmuNSyU1AOn0z_jKZIpJNz-nUAZkt388',
        subs: JSON.parse(localStorage.getItem('b_subs')) || [],
        selectedStars: 0,

        init() {
            const saved = localStorage.getItem('buny_note');
            if(saved) document.getElementById('marquee-text').innerText = saved;
            this.fetchVideos("trend");
            this.setupStars();
            this.startRatingTimer();
        },

        // 30 Dakika Sayacı (Test için 30 saniye yapmak istersen 1800000 yerine 30000 yazabilirsin)
        startRatingTimer() {
            if(!localStorage.getItem('voted')) {
                setTimeout(() => {
                    document.getElementById('rating-modal').style.display = 'flex';
                }, 1800000); // 30 dakika
            }
        },

        setupStars() {
            const stars = document.querySelectorAll('#star-container i');
            stars.forEach(s => {
                s.onclick = () => {
                    this.selectedStars = s.dataset.v;
                    stars.forEach(x => x.classList.remove('active'));
                    for(let i=0; i<this.selectedStars; i++) stars[i].classList.add('active');
                };
            });
        },

        submitRating() {
            if(this.selectedStars === 0) return alert("Lütfen bir yıldız seçin!");
            const comment = document.getElementById('rating-comment').value;
            const data = { stars: this.selectedStars, comment: comment, date: new Date().toLocaleString() };
            let ratings = JSON.parse(localStorage.getItem('all_ratings')) || [];
            ratings.push(data);
            localStorage.setItem('all_ratings', JSON.stringify(ratings));
            localStorage.setItem('voted', 'true');
            alert("Puanın başarıyla gönderildi, teşekkürler!");
            document.getElementById('rating-modal').style.display = 'none';
        },

        async fetchVideos(q, limit=20) {
            const feed = document.getElementById('main-feed');
            feed.innerHTML = '<p style="text-align:center; padding:50px;">Yükleniyor...</p>';
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=${limit}&q=${encodeURIComponent(q)}&type=video&key=${this.KEY}`);
                const data = await res.json();
                feed.innerHTML = data.items.map(v => `
                    <div class="v-card" onclick="app.play('${v.id.videoId}', '${v.snippet.title.replace(/'/g,"")}', '${v.snippet.channelTitle}')">
                        <img src="${v.snippet.thumbnails.high.url}">
                        <div style="padding:10px"><p style="font-size:14px; font-weight:bold;">${v.snippet.title}</p><small style="color:gray;">${v.snippet.channelTitle}</small></div>
                    </div>`).join('');
            } catch (e) { feed.innerHTML = '<p>Limit Doldu!</p>'; }
        },

        play(id, title, channel) {
            this.activeChannel = channel;
            document.getElementById('player').style.display = 'block';
            document.getElementById('p-title').innerText = title;
            document.getElementById('sub-btn').innerText = this.subs.includes(channel) ? "Abone Olundu" : "Abone Ol";
            document.getElementById('player-box').innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
        },

        toggleSub() {
            if(this.subs.includes(this.activeChannel)) {
                this.subs = this.subs.filter(c => c !== this.activeChannel);
            } else { this.subs.push(this.activeChannel); }
            localStorage.setItem('b_subs', JSON.stringify(this.subs));
            document.getElementById('sub-btn').innerText = this.subs.includes(this.activeChannel) ? "Abone Olundu" : "Abone Ol";
        },

        showSubs() {
            if(this.subs.length === 0) return alert("Kimseye abone değilsin.");
            // SADECE ABONE OLUNAN KANALLARIN EN YENİ VİDEOLARI (Filtreli)
            this.fetchVideos(this.subs.join("|"), 10);
        },

        openAdminModal() {
            const p = prompt("Admin Şifresi:");
            if(p === "Muhiy.1905") {
                document.getElementById('admin-dashboard').style.display = 'block';
                const r = JSON.parse(localStorage.getItem('all_ratings')) || [];
                document.getElementById('admin-ratings-list').innerHTML = r.map(x => `<div>⭐ ${x.stars} - ${x.comment} <br><small>${x.date}</small><hr style="border:#222"></div>`).join('');
            }
        },

        updateAnn() {
            const val = document.getElementById('ann-input').value;
            if(val) { localStorage.setItem('buny_note', val); document.getElementById('marquee-text').innerText = val; alert("Yayınlandı!"); }
        },
        closePlayer() { document.getElementById('player').style.display = 'none'; document.getElementById('player-box').innerHTML = ''; },
        closeAdminPanel() { document.getElementById('admin-dashboard').style.display = 'none'; }
    };
    window.onload = () => app.init();
    </script>
</body>
</html>
