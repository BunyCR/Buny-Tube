<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNY TUBE VANCED PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --v-red: #ff0000; --v-black: #000000; --v-gray: #0f0f0f; --v-text: #ffffff; --neon: #00f2ff; }
        
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--v-black); color: var(--v-text); overflow-x: hidden; padding-bottom: 80px; }

        /* --- HAREKETLİ BAKIM EKRANI --- */
        #bakim-ekran { 
            position: fixed; inset: 0; background: #000; z-index: 1000000; 
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; 
        }

        .ani-logo { font-size: 70px; color: var(--v-red); animation: pulse 2s infinite; }
        
        .ani-text { 
            margin-top: 20px; font-size: 24px; font-weight: 900; color: var(--neon);
            text-shadow: 0 0 10px var(--neon);
            animation: float 3s ease-in-out infinite;
        }

        .patron-key {
            margin-top: 60px; font-size: 30px; color: #222; cursor: pointer;
            transition: 0.3s; padding: 20px;
        }
        .patron-key:hover { color: var(--neon); transform: scale(1.2); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- DİĞER VANCED ÖZELLİKLERİ --- */
        header { position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: -1.5px; display: flex; align-items: center; gap: 5px; }
        .logo i { color: var(--v-red); font-size: 26px; }
        
        .search-section { padding: 15px; }
        .search-box { background: #222; border-radius: 40px; display: flex; align-items: center; padding: 5px 20px; border: 1px solid #333; }
        .search-box input { flex: 1; background: none; border: none; color: white; padding: 10px; font-size: 16px; outline: none; }
        
        .v-feed { display: flex; flex-direction: column; gap: 2px; }
        .v-card { background: var(--v-black); width: 100%; cursor: pointer; margin-bottom: 10px; }
        .v-thumb { position: relative; width: 100%; aspect-ratio: 16/9; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-info { padding: 12px; display: flex; gap: 12px; }
        .v-title { font-size: 15px; font-weight: 500; line-height: 1.4; }
        .v-sub { font-size: 12px; color: #aaa; }

        #v-player { position: fixed; inset: 0; background: #000; z-index: 2000000; display: none; flex-direction: column; }
        #p-frame { width: 100%; aspect-ratio: 16/9; }
        
        nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: var(--v-black); border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { color: #888; text-align: center; font-size: 10px; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

    <div id="bakim-ekran">
        <i class="fab fa-youtube ani-logo"></i>
        <div class="ani-text">SİSTEM BAKIMDA</div>
        <p style="color: #444; margin-top: 15px; font-size: 14px;">Muhammed Ali motoru soğutuyor...</p>
        
        <div class="patron-key" onclick="app.patronCheck()">
            <i class="fas fa-key"></i>
        </div>
    </div>

    <header>
        <div class="logo"><i class="fab fa-youtube"></i> <span>Vanced</span></div>
        <div onclick="app.showAdmin()"><i class="fas fa-user-shield" style="color: #222;"></i></div>
    </header>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="q" placeholder="Aramaya başla..." onkeyup="if(event.key==='Enter') app.search()">
            <i class="fas fa-search" onclick="app.search()" style="color:var(--neon)"></i>
        </div>
    </div>

    <div id="feed" class="v-feed"></div>

    <div id="v-player">
        <div style="padding:15px;" onclick="app.closePlayer()"><i class="fas fa-chevron-down"></i></div>
        <div id="p-frame"></div>
    </div>

    <nav>
        <div class="nav-item" onclick="location.reload()"><i class="fas fa-home"></i>Ana Sayfa</div>
        <div class="nav-item"><i class="fas fa-bolt"></i>Shorts</div>
        <div class="nav-item"><i class="fas fa-plus-circle" style="font-size: 28px;"></i></div>
        <div class="nav-item"><i class="fas fa-layer-group"></i>Abonelik</div>
        <div class="nav-item"><i class="fas fa-play-circle"></i>Kitaplık</div>
    </nav>

    <script>
    const app = {
        servers: ['https://api.piped.victr.me', 'https://pipedapi.kavin.rocks', 'https://piped-api.lunar.icu'],

        init() {
            if(localStorage.getItem('buny_bakim') === 'true') {
                document.getElementById('bakim-ekran').style.display = 'flex';
            }
        },

        // PATRON GİZLİ GİRİŞİ (ANAHTAR)
        patronCheck() {
            const pw = prompt("Patron Şifresini Girin:");
            if(pw === "Muhiy.1905") {
                const onay = confirm("Şifre Doğru! Bakım modunu kapatıp sistemi herkese açmak istiyor musunuz?");
                if(onay) {
                    this.setBakim(false);
                }
            } else {
                alert("Yanlış anahtar!");
            }
        },

        async search() {
            const q = document.getElementById('q').value;
            if(!q) return;
            const feed = document.getElementById('feed');
            feed.innerHTML = '<p style="text-align:center; padding:20px;">Derin arama yapılıyor...</p>';

            for(let server of this.servers) {
                try {
                    const res = await fetch(`${server}/search?q=${encodeURIComponent(q)}&filter=videos`);
                    const data = await res.json();
                    if(data.content) {
                        feed.innerHTML = data.content.map(v => {
                            const id = v.url.split('=')[1] || v.url.split('/').pop();
                            return `
                            <div class="v-card" onclick="app.play('${id}')">
                                <div class="v-thumb"><img src="${v.thumbnail}"></div>
                                <div class="v-info">
                                    <div class="v-meta">
                                        <div class="v-title">${v.title}</div>
                                        <div class="v-sub">${v.uploaderName}</div>
                                    </div>
                                </div>
                            </div>`;
                        }).join('');
                        break;
                    }
                } catch(e) {}
            }
        },

        play(id) {
            document.getElementById('v-player').style.display = 'flex';
            document.getElementById('p-frame').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
        },

        closePlayer() {
            document.getElementById('v-player').style.display = 'none';
            document.getElementById('p-frame').innerHTML = '';
        },

        showAdmin() {
            const pw = prompt("Yönetici Paneli Şifresi:");
            if(pw === "Muhiy.1905") {
                const durum = confirm("Bakım modunu AÇMAK mı istiyorsunuz?\n(Tamam: AÇ, İptal: KAPAT)");
                this.setBakim(durum);
            }
        },

        setBakim(v) {
            localStorage.setItem('buny_bakim', v);
            location.reload();
        }
    };

    window.onload = () => app.init();
    </script>
</body>
</html>
